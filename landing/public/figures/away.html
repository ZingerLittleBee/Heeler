<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>While you're away</title><style>

  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}

html,body{height:100%}
body{overflow:hidden}
.iso-page{width:auto;height:100%;margin:0}

</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.hs-stage{touch-action:pan-y;position:relative;cursor:pointer}
.hs-stage:focus{outline:none}
.hs-stage[data-kbd]:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.hs-stage [hidden]{display:none}
.hs-live{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* herdr's status colours (Catppuccin), as in Fig 1: Mocha on dark, Latte inks on light */
.iso{
  --hs-red:#f38ba8;--hs-green:#a6e3a1;--hs-yellow:#f9e2af;--hs-muted:#a6adc8;
  --hs-card:#191919;--hs-well:#0c0c0c;--hs-ink:#e9e9e6;
  --hs-split:#3e3e3e;--hs-split-fine:#262626;
  --hs-glass:#090909;--hs-field:#151515;--hs-lamp:#f2f2ee;
  --hs-tube-back:rgba(255,255,255,.035);--hs-tube-front:rgba(255,255,255,.05);
}
.iso[data-theme="light"]{
  --hs-red:#c70030;--hs-green:#0d7900;--hs-yellow:#9f5300;--hs-muted:#5c5f77;
  --hs-card:#fdfdfb;--hs-well:#d6d6d3;--hs-ink:#1d1d20;
  --hs-split:#d3d3d0;--hs-split-fine:#e9e9e6;
  --hs-glass:#cfcfcc;--hs-field:#ececE9;--hs-lamp:#1b1b1e;
  --hs-tube-back:rgba(0,0,0,.05);--hs-tube-front:rgba(255,255,255,.28);
}

/* split-flap faces */
.hs-well{fill:var(--hs-well)}
.hs-card-well{fill:var(--hs-card)}
.hs-card-field{fill:var(--hs-field)}
.hs-card-clear{fill:none}
.hs-card{fill:var(--hs-card);stroke:var(--hs-card-stroke,none);stroke-width:.35px;vector-effect:non-scaling-stroke}
.m-ff,.m-fr{--hs-card-stroke:var(--anatomy-mid)}
.hs-mod[data-fade] .m-ff,.hs-mod[data-fade] .m-fr{--hs-card-stroke:none}
.hs-ft{font-family:var(--anatomy-mono);font-weight:600;fill:var(--hs-ft-ink,var(--hs-ink));letter-spacing:.01em}
.hs-plate-name{font-weight:500}
.hs-engrave text{letter-spacing:.18em;font-weight:600}
.hs-slot-name{letter-spacing:.16em}
.iso-line.hs-hinge{stroke:var(--hs-split)}
.iso-line.hs-hinge-fine{stroke:var(--hs-split-fine);stroke-width:.4px}

/* status glyphs (Fig 1) */
.hs-g-body{fill:var(--hs-c)}
.hs-g-cut{fill:none;stroke:var(--hs-card);stroke-linecap:round;stroke-linejoin:round}
.hs-g-ring{fill:none;stroke:var(--hs-c);stroke-linecap:round}
.hs-g[data-s="blocked"],.hs-dot[data-s="blocked"]{--hs-c:var(--hs-red)}
.hs-g[data-s="done"]{--hs-c:var(--hs-green)}
.hs-g[data-s="working"],.hs-dot[data-s="working"]{--hs-c:var(--hs-yellow)}
.hs-dot{fill:var(--hs-c);transition:fill .3s var(--anatomy-ease)}

/* lamps: the page writes each lamp's opacity */
.hs-ssh-lamp,.hs-hook-lamp,.hs-apns-lamp{fill:var(--hs-lamp);opacity:0;pointer-events:none}
.hs-ssh-lamp-core,.hs-hook-lamp-core,.hs-apns-lamp-core{fill:#fff;opacity:0;pointer-events:none}

/* the press: the die's face and its key */
.hs-die-face{fill:var(--anatomy-shade-1);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-key-mark{fill:var(--anatomy-lit);fill-rule:evenodd}

/* the capsule: a lit seal in the Host's key, and a tag with what the Push Relay may read */
.hs-seal{opacity:var(--hs-seal,1);transition:opacity .08s linear}
.hs-seal-disc{fill:var(--anatomy-lit)}
.hs-seal-key{fill:var(--anatomy-paper);fill-rule:evenodd}
.hs-tag{fill:var(--hs-card);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-tag-text{font-weight:600}
.hs-tag .hs-g-cut{stroke:var(--hs-card)}
.hs-cap-use{transition:opacity .5s var(--anatomy-ease)}
.hs-cap-use[data-off]{opacity:0}

/* the glass: a faint tint behind what it holds, a fainter skin and long glints in front */
.hs-glass-back{fill:var(--hs-tube-back)}
.hs-glass-front{fill:var(--hs-tube-front);pointer-events:none}
.iso-line.hs-glass-edge{stroke:var(--anatomy-mid)}
/* on light the glints are paper white, not the dark ink a "hi" tone means there */
.iso[data-theme="light"] .hs-glints{--anatomy-hi:var(--anatomy-card);opacity:.7}

/* the phone */
.hs-glass{fill:var(--hs-glass)}
.hs-field{fill:var(--hs-field)}
.hs-face{transition:opacity .35s var(--anatomy-ease)}
.hs-face[data-off]{opacity:0}
.hs-card-platter{fill:var(--hs-field);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-icon{fill:var(--anatomy-hi)}
.hs-icon-mark{fill:none;stroke:var(--hs-field);stroke-width:.9px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hs-card-title{font-weight:700}
.hs-card-body{font-weight:500}
.hs-la-ws{font-weight:600}
.hs-la-agent{font-weight:500}
/* the Live Activity's count chips: status ink on a pale wash of it */
.hs-chip[data-s="blocked"]{--hs-c:var(--hs-red)}
.hs-chip[data-s="working"]{--hs-c:var(--hs-yellow)}
.hs-chip[data-s="done"]{--hs-c:var(--hs-green)}
.hs-chip-wash{fill:var(--hs-c);fill-opacity:.16}
.hs-chip-text{fill:var(--hs-c);font-weight:700}
.hs-ft-small{font-weight:600}
/* the grace drum: a plain zero, no slash or dot */
.hs-drum{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.hs-pick{fill:none;stroke:var(--anatomy-lit);stroke-width:1px;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .3s var(--anatomy-ease)}
.hs-pick[data-on]{opacity:1}
/* the opened seal on the dock glows as the phone opens an alert */
.hs-key-glow{fill:none;stroke:var(--anatomy-lit);stroke-width:1.3px;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none}

/* the valve's lever, flat on its hub */
.hs-lever-side{fill:var(--anatomy-shade-2);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-lever-top{fill:var(--anatomy-hi);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round}

/* the SSH events line: a chunk carrying herdr's event is drawn lit */
.hs-wire .tb-body,.hs-wire .tb-shine,.hs-wire .tb-shade{transition:fill .4s var(--anatomy-ease)}
.hs-wire[data-hot] .tb-body,.hs-wire[data-hot] .tb-shine,.hs-wire[data-hot] .tb-shade{fill:var(--anatomy-lit);transition:fill .05s linear}

.hs-focus{fill:none;stroke:var(--anatomy-lit);stroke-width:1.2px;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;pointer-events:none}

.hs-stage[data-crop] svg{width:100%;height:auto;overflow:hidden}

/* legend swatches: the figure's own marks, small */
.hs-sw{height:14px;flex:none;overflow:visible}
.hs-sw rect,.hs-sw circle,.hs-sw path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.hs-sw .hs-g-body{fill:var(--hs-c);stroke:none}
.hs-sw .hs-g-ring{stroke:var(--hs-c);vector-effect:none;stroke-width:1.58px}
.hs-sw .hs-g-cut{stroke:var(--anatomy-page);vector-effect:none;stroke-width:1.22px}
.hs-sw .f-key{fill:var(--anatomy-lit);stroke:none}
.hs-sw .f-glass{stroke:var(--anatomy-mid)}
.hs-sw .f-glint{stroke:var(--anatomy-hi);stroke-width:.8}
.hs-sw .f-tube-o{stroke-width:3.2px}
.hs-sw .f-tube-i{stroke:var(--anatomy-page);stroke-width:1.4px}

/* a long readout wraps onto a second line, right-aligned, rather than running into the hint */
.iso-plate-corner[data-corner="readout"]{max-width:calc(100% - 300px);white-space:normal;text-align:right;line-height:1.35}

/* phone: the readout wraps onto two lines under the hint instead of running off the card (as Fig 1) */
@media (max-width:560px){
  .iso-plate.iso-plate{padding-bottom:78px}
  .iso-plate-corner[data-corner="hint"]{bottom:33px}
  .iso-plate-corner[data-corner="readout"]{left:0;max-width:none;white-space:normal;text-align:right;line-height:1.35}
}

ting for input, and a Live Activity with one row per Agent, api / claude first with a red dot and chips reading 1 blocked and 2 working. Beside the phone the same key stands as a seal split open in two. A corrugated SSH events line runs from the hood down the case side and along the bench into a timer valve on the dock, its drum at 00 and its lever across the line: shut."><defs><clipPath id="hs-ct-st"><rect x="-1" y="-1" width="15" height="7.5"/></clipPath><clipPath id="hs-cb-st"><rect x="-1" y="6.5" width="15" height="7.5"/></clipPath><g id="hs-v-st-blocked"><rect class="hs-card" x="0.25" y="0.25" width="12.5" height="5.93" rx="0.8"/><rect class="hs-card" x="0.25" y="6.82" width="12.5" height="5.93" rx="0.8"/><g class="hs-g" data-s="blocked"><circle class="hs-g-body" cx="6.5" cy="6.5" r="4.1"/><path class="hs-g-cut" stroke-width="1.39" d="M6.5 4.37L6.5 6.91M6.5 8.39h0.01"/></g></g><g id="hs-v-st-working"><rect class="hs-card" x="0.25" y="0.25" width="12.5" height="5.93" rx="0.8"/><rect class="hs-card" x="0.25" y="6.82" width="12.5" height="5.93" rx="0.8"/><g class="hs-g" data-s="working"><path class="hs-g-ring" stroke-width="1.8" d="M6.5 3.3A3.2 3.2 0 1 1 3.3 6.5"/></g></g><clipPath id="hs-ct-nm"><rect x="-1" y="-1" width="46" height="7.5"/></clipPath><clipPath id="hs-cb-nm"><rect x="-1" y="6.5" width="46" height="7.5"/></clipPath><g id="hs-v-nm-claude"><rect class="hs-card" x="0.25" y="0.25" width="43.5" height="5.93" rx="0.8"/><rect class="hs-card" x="0.25" y="6.82" width="43.5" height="5.93" rx="0.8"/><text class="hs-ft" x="22" y="9.02" font-size="9" text-anchor="middle">claude</text></g><g id="hs-v-nm-codex"><rect class="hs-card" x="0.25" y="0.25" width="43.5" height="5.93" rx="0.8"/><rect class="hs-card" x="0.25" y="6.82" width="43.5" height="5.93" rx="0.8"/><text class="hs-ft" x="22" y="9.02" font-size="9" text-anchor="middle">codex</text></g><g id="hs-v-nm-droid"><rect class="hs-card" x="0.25" y="0.25" width="43.5" height="5.93" rx="0.8"/><rect class="hs-car 3" cy="174.37" rx="0.92" ry="0.75"/></g></g></svg><p class="hs-live" aria-live="polite"></p></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><path class="f-key" fill-rule="evenodd" d="M3.1 7a2.95 2.95 0 1 0 5.89 0a2.95 2.95 0 1 0 -5.89 0ZM4.8 7a1.24 1.24 0 1 0 2.48 0a1.24 1.24 0 1 0 -2.48 0ZM8.75 6.07H18.29V9.25H16.81V7.93H15.73V9.87H14.33V7.93H8.75Z"/></svg>Notification Key: one per Host, also on your phone</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 31 14" style="width:31px" aria-hidden="true"><g class="hs-g" data-s="blocked"><circle class="hs-g-body" cx="4.6" cy="7" r="3.6"/><path class="hs-g-cut" stroke-width="1.22" d="M4.6 5.13L4.6 7.36M4.6 8.66h0.01"/></g><g class="hs-g" data-s="done"><circle class="hs-g-body" cx="15.1" cy="7" r="3.6"/><path class="hs-g-cut" stroke-width="1.22" d="M13.44 7.07L14.67 8.3L16.76 5.92"/></g><g class="hs-g" data-s="working"><path class="hs-g-ring" stroke-width="1.58" d="M25.6 4.19A2.81 2.81 0 1 1 22.79 7"/></g></svg>Live Activity counts travel in plaintext</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><path class="f-tube-o" d="M20 2V7.5C20 10 18 11 15.5 11H2"/><path class="f-tube-i" d="M20 2V7.5C20 10 18 11 15.5 11H2"/></svg>SSH events line: shut 20 s after you leave</span></span><span class="iso-caption">Once you leave Heeler, SSH closes after a 20 s grace, and the Host's plugin seals each Blocked or Done alert with that Host's Notification Key. The Push Relay passes it to APNs; both see only the outside (the address and the Live Activity counts), never the content. Your phone opens it with the same key, which it made and gave the Host over SSH.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {

  }

    m.to = null;

    show(m.fr, false);

// ---------------------------------------------------------------- the idle tour: it starts and ends on the resting pose

  const want = S.ssh ? 1 : 0;
  sshGlow = still.matches ? want : sshGlow + (want - sshGlow) * Math.min(1, dt * 8);
  if (Math.abs(sshGlow - want) < 1e-3) sshGlow = want;
  sshLamp[0].style.opacity = (0.85 * sshGlow).toFixed(3);
  sshLamp[1].style.opacity = (0.45 * sshGlow).toFixed(3);
  // the die comes down fast (the stamp) and lifts a little slower
  ram.a = still.matches ? ram.target : ram.a + (ram.target - ram.a) * Math.min(1, dt * (ram.target < ram.a ? 30 : 12));
  if (Math.abs(ram.a - ram.target) < 1e-3) ram.a = ram.target;
  for (const el of rams) el.setAttribute("transform", ram.a > 1e-3 ? `translate(${f2(D.ram[0] * ram.a)} ${f2(D.ram[1] * ram.a)})` : "");
  lever.a = still.matches ? lever.target : lever.a + (lever.target - lever.a) * Math.min(1, dt * 7);
  if (Math.abs(lever.a - lever.target) < 1e-3) lever.a = lever.target;
  leverSide.setAttribute("d", leverPath(lever.a, D.lever.z));
  leverTop.setAttribute("d", leverPath(lever.a, D.lever.z + 0.9));
  // the event runs down the events line, hood to valve, a few chunks long
  const head = pulseAt === null ? -1 : ((clock - pulseAt) / PULSE) * (chunks.length + 4);
  if (pulseAt !== null && head > chunks.length + 5) pulseAt = null;
  chunks.forEach((el, i) => el.toggleAttribute("data-hot", pulseAt !== null && i <= head && i > head - 5));
}

// ---------------------------------------------------------------- the loop
let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const due = events.filter((e) => e.at <= clock);
  if (due.length) {
    events = events.filter((e) => e.at > clock);
    due.sort((a, b) => a.at - b.at).forEach((e) => e.fn());
  }
  const lit = Object.values(lamps).some((lamp) => flash(clock - lamp.at) > 1e-3) || ram.a !== ram.target;
  let busy = touring || events.length > 0 || pulseAt !== null || lit || lever.a !== lever.target || sshGlow !== (S.ssh ? 1 : 0);
  for (const m of Object.values(mods)) busy = stepModule(m, dt) || busy;
  for (const c of Object.values(caps)) busy = stepCap(c, dt) || busy;
  draw(dt);
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function kick() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) kick();
}, { rootMargin: "120px 0px" }).observe(stage);
// narrow cards show the story region (press to phone) larger, rather than the whole bench small
const fullBox = svg.getAttribute("viewBox");
new ResizeObserver(() => {
  const narrow = stage.clientWidth < 520;
  svg.setAttribute("viewBox", narrow ? D.crop.join(" ") : fullBox);
  stage.toggleAttribute("data-crop", narrow);
}).observe(stage);
// the resting pose: away, SSH shut, claude Blocked, the alert carrier under the die and the Live Activity one in the
// glass, the alert open on the lock screen
for (const c of Object.values(caps)) placeCap(c);
draw(0);
if (touring) startTour();
</script></body></html>
