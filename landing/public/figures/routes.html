  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}

.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.hs-stage{touch-action:pan-y;position:relative;cursor:pointer}
.hs-stage:focus{outline:none}
.hs-stage[data-kbd]:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.hs-stage [hidden]{display:none}
.hs-live{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* herdr's status colours (Catppuccin), as in Fig 1: Mocha on dark, Latte inks on light */
.iso{
  --hs-red:#f38ba8;--hs-green:#a6e3a1;--hs-yellow:#f9e2af;--hs-muted:#a6adc8;
  --hs-card:#191919;--hs-well:#0c0c0c;--hs-ink:#e9e9e6;
  --hs-glass:#090909;--hs-field:#151515;--hs-lamp:#f2f2ee;
  --hs-bore:#030303;--hs-direct:#89b4fa;--hs-overlay:#cba6f7;--hs-jump:#fab387;
}
.iso[data-theme="light"]{
  --hs-red:#c70030;--hs-green:#0d7900;--hs-yellow:#9f5300;--hs-muted:#5c5f77;
  --hs-card:#fdfdfb;--hs-well:#d6d6d3;--hs-ink:#1d1d20;
  --hs-glass:#cfcfcc;--hs-field:#ececE9;--hs-lamp:#1b1b1e;
  --hs-bore:#5e5e5b;--hs-direct:#1e66f5;--hs-overlay:#8839ef;--hs-jump:#fe640b;
}

.hs-well{fill:var(--hs-well)}
.hs-card-well{fill:var(--hs-card)}
.hs-ft{font-family:var(--anatomy-mono);font-weight:600;fill:var(--hs-ink);letter-spacing:.01em}
.hs-plate-name{font-weight:500}
.hs-engrave{letter-spacing:.08em;font-weight:700}
.hs-scale{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-variant-numeric:tabular-nums}

/* lamps: the page writes each lamp's opacity */
.hs-lamp-glow{fill:var(--hs-lamp);opacity:0;pointer-events:none}
.hs-lamp-core{fill:#fff;opacity:0;pointer-events:none}
.hs-lamp-glow[data-tint="red"]{fill:var(--hs-red)}

/* keys: the Host's trusted key on the reader, a ball's key on its seal */
.hs-seal-disc{fill:var(--hs-card);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-seal-key{fill:var(--hs-ink);fill-rule:evenodd}
.hs-seal[data-lit] .hs-seal-disc,.hs-trusted .hs-seal-disc{fill:var(--anatomy-lit);stroke:none}
.hs-seal[data-lit] .hs-seal-key,.hs-trusted .hs-seal-key{fill:var(--anatomy-paper)}
.hs-key-ring{fill:none;stroke:var(--anatomy-lit);stroke-width:1.2px;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none}
.hs-key-ring[data-tint="red"]{stroke:var(--hs-red)}

/* moving flat parts: the pawls and the Host's lever, a face and its edge */
.hs-plate-side{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-plate-face{fill:var(--anatomy-shade-0);stroke:var(--anatomy-hi);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}

.hs-ball[data-off]{opacity:0}

/* the phone: Heeler's Host detail */
.hs-glass{fill:var(--hs-glass)}
.hs-field{fill:var(--hs-field)}
.hs-card-platter{fill:var(--hs-field);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-title{font-weight:700}
.hs-status{font-weight:700}
.hs-sub{font-weight:500}
.hs-addr{font-weight:600}
.hs-head{font-weight:700;letter-spacing:.06em}
.hs-swap{transition:opacity .3s var(--anatomy-ease)}
.hs-swap[data-off]{opacity:0}
/* a Route's tag: In Use in green, Failed in red, each on a pale wash of its ink (HostRouteTag) */
.hs-tag[data-s="use"]{--hs-c:var(--hs-green)}
.hs-tag[data-s="failed"]{--hs-c:var(--hs-red)}
.hs-tag-wash{fill:var(--hs-c);fill-opacity:.16}
.hs-tag-text{fill:var(--hs-c);font-weight:700}
.hs-dot{fill:var(--hs-c,var(--hs-muted));transition:fill .3s var(--anatomy-ease)}
.hs-dot[data-s="connected"]{--hs-c:var(--hs-green)}
.hs-dot[data-s="connecting"]{--hs-c:var(--hs-yellow)}

/* the SSH line: a chunk carrying the new session is drawn lit */
.hs-wire .tb-body,.hs-wire .tb-shine,.hs-wire .tb-shade{transition:fill .4s var(--anatomy-ease)}
.hs-wire[data-hot] .tb-body,.hs-wire[data-hot] .tb-shine,.hs-wire[data-hot] .tb-shade{fill:var(--anatomy-lit);transition:fill .05s linear}

.hs-focus{fill:none;stroke:var(--anatomy-lit);stroke-width:1.2px;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;pointer-events:none}
.hs-stage[data-crop] svg{width:100%;height:auto;overflow:hidden}

/* legend swatches: the figure's own marks, small */
.hs-sw{height:14px;flex:none;overflow:visible}
.hs-sw path,.hs-sw rect,.hs-sw circle{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.hs-sw .f-key-disc{fill:var(--anatomy-lit);stroke:none}
.hs-sw .f-key{fill:var(--anatomy-page);stroke:none;fill-rule:evenodd}
.hs-sw .f-tick-major{stroke:var(--anatomy-hi)}
.hs-sw .f-tick{stroke:var(--anatomy-mid)}
.hs-sw .f-wash{fill:var(--hs-green);fill-opacity:.16;stroke:none}
.hs-sw .f-tag{fill:var(--hs-green);stroke:none;font-family:var(--anatomy-mono);font-weight:700;font-size:7px}
.hs-sw .f-tube-o{stroke-width:3.2px}
.hs-sw .f-tube-i{stroke:var(--anatomy-page);stroke-width:1.4px}

/* a long readout wraps onto a second line, right-aligned, rather than running into the hint */
.iso-plate-corner[data-corner="readout"]{max-width:calc(100% - 300px);white-space:normal;text-align:right;line-height:1.35}
@media (max-width:560px){
  .iso-plate.iso-plate{padding-bottom:78px}
  .iso-plate-corner[data-corner="hint"]{bottom:33px}
  .iso-plate-corner[data-corner="readout"]{left:0;max-width:none;white-space:normal;text-align:right;line-height:1.35}
}
@media (prefers-reduced-motion:reduce){.hs-swap{transition:none}}
/* a ball's seal: the key of the machine its Route reached; the winner's is lit */
.hs-ball-seal{fill:var(--hs-seal-bg,var(--hs-card));stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-ball-key{fill:var(--hs-seal-ink,var(--hs-ink));fill-rule:evenodd}
.hs-ball[data-lit]{--hs-seal-bg:var(--anatomy-lit);--hs-seal-ink:var(--anatomy-paper)}
/* the narrow crop cuts the bench, so its soft shadow would end in a hard edge */
.hs-stage[data-crop] .iso-halo{display:none}
.hs-switch-word{letter-spacing:.06em}

/* each Route's colour, after the app's route kinds (HostRouteFields.swift:409-415): Direct blue, Overlay indigo, Jump orange */
[data-route="direct"]{--hs-tint:var(--hs-direct)}
[data-route="overlay"]{--hs-tint:var(--hs-overlay)}
[data-route="jump"]{--hs-tint:var(--hs-jump)}
.hs-kind{fill:var(--hs-tint)}
.hs-ball-band{fill:var(--hs-tint);fill-rule:evenodd}
.hs-lobe{fill:var(--hs-tint);stroke:none}
.hs-needle{fill:var(--anatomy-lit);stroke:var(--anatomy-paper);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-major{fill:none;stroke:var(--anatomy-lit);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linecap:round}
.hs-tag-addr{font-weight:700;letter-spacing:.02em}
.hs-tag-kind{font-weight:600}
.hs-foot{font-weight:500}
.hs-nav{font-weight:500}
.hs-chevron{fill:none;stroke:var(--hs-ink);stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
/* the spout's bore: dark inside, a crescent of shadow under its top edge */
.hs-bore{fill:var(--hs-bore)}
.hs-bore-shade{fill:#000;fill-opacity:.55}
.iso[data-theme="light"] .hs-bore-shade{fill-opacity:.28}
/* the match ring: lit green round the trusted key and the cup's ball, red round a rejected one */
.hs-match{fill:none;stroke:var(--hs-green);stroke-width:1.8px;vector-effect:non-scaling-stroke}
.hs-ring{transition:opacity .25s var(--anatomy-ease);pointer-events:none}
.hs-ring[data-off]{opacity:0}

</style><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 2</span><span class="iso-plate-corner" data-corner="title">One Host, many Routes</span><span class="iso-plate-corner" data-corner="hint">Press the cam, or flip the Wi-Fi switch</span><span class="iso-plate-corner" data-corner="readout" data-readout>Away · Tailscale presented macbook's key</span></div><div class="iso-stage hs-stage" tabindex="0" role="group" aria-roledescription="marble run" aria-label="How Heeler reaches one Host over several Routes. Space or a tap on the cam starts a new connection; H or a tap on the box in front of the phone moves the phone between its home Wi-Fi and elsewhere, which is the phone's network, not a Heeler setting; the arrow keys move between the cam, the network switch, the pawls, the route tags, the gates, the sleeve, the vps box, the stop bar, the chute, the key plate, the cup, the phone, the SSH line and the Host."><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 320" role="img" aria-label="A precision marble run on a long bench, read left to right. On the left a phone stands on a dock showing Heeler's Host detail for macbook: Connected, 100.64.0.5 · Tailscale, and a Routes list, each row with a coloured dot: 192.168.1.20 Direct in blue, 100.64.0.5 Tailscale in mauve marked In Use, and 127.0.0.1:2222 via vps in orange, over the footer that Heeler tries every route each time it connects and keeps the first that reaches the Host. In front of the phone a box with a window reads ELSEWHERE, the phone's network. Beside it a tower carries a cam: a steel disc with three coloured lobes, a needle reading off a fixed scale marked 0 and 400 ms, and three push rods that lift three pawls holding a ball at the head of each of three stacked tracks: Direct on top, then Tailscale, then via vps, each named by a tag at its head with its address and kind. The tracks fall right toward a column under a hood whose plate reads macbook. The Direct track passes under an open gate, the Tailscale track runs through a closed steel sleeve, and the vps track through a box with vps's own key and past its own gate. Near the column a stop bar has dropped its fingers into the tracks, and the blue Direct ball and the orange vps ball rest against it. On the bench's front a pedestal holds a plate with macbook's trusted key and, beside it, a cup in which the mauve Tailscale ball shows the same key; a lit green ring circles the plate's key and the ball. A chute runs from a spout on the column to the cup, and a corrugated SSH line runs from the pedestal along the bench to the phone's bottom connector."><defs><g id="hs-ball-blank"><g class="iso-solid" data-seamless=""><path class="iso-fill" d="M326.7 241.1L326.8 239.9L327 238.6L327.4 237.4L328 236.3L328.7 235.3L329.5 234.3L330.4 233.5L331.5 232.8L332.6 232.2L333.8 231.8L335 231.6L336.3 231.5L337.5 231.6L338.8 231.8L340 232.2L341.1 232.8L342.1 233.5L343.1 234.3L343.9 235.3L344.6 236.3L345.2 237.4L345.6 238.6L345.8 239.9L345.9 241.1L345.8 242.4L345.6 243.6L345.2 244.8L344.6 245.9L343.9 247L343.1 247.9L342.1 248.7L341.1 249.4L340 250L338.8 250.4L337.5 250.6L336.3 250.7L335 250.6L333.8 250.4L332.6 250L331.5 249.4L330.4 248.7L329.5 247.9L328.7 247L328 245.9L327.4 244.8L327 243.6L326.8 242.4Z"/><path class="iso-shade" data-shade="0" d="M326.7 241.1L326.8 239.9L327 238.6L327.4 237.4L328 236.3L328.7 235.3L329.5 234.3L330.4 233.5L331.5 232.8L332.6 232.2L333.8 231.8L335 231.6L336.3 231.5L337.5 231.6L338.8 231.8L340 232.2L341.1 232.8L342.1 233.5L343.1 234.3L343.9 235.3L344.6 236.3L345.2 237.4L345.6 238.6L345.8 239.9L345.9 241.1L345.8 242.4L345.6 243.6L345.2 244.8L344.6 245.9L343.9 247L343.1 247.9L342.1 248.7L341.1 249.4L340 250L338.8 250.4L337.5 250.6L336.3 250.7L335 250.6L333.8 250.4L332.6 250L331.5 249.4L330.4 248.7L329.5 247.9L328.7 247L328 245.9L327.4 244.8L327 243.6L326.8 242.4Z"/><path class="iso-shade" da orm="matrix(1.233 0.121 0 1.205 326.038 253.336)"><path class="hs-match" d="M90.8 -16.4L93.3 -16.7L95.8 -17.4L98.1 -18.6L100 -20.3L101.7 -22.2L102.9 -24.5L103.6 -27L103.9 -29.5L103.9 -29.5L103.6 -32.1L102.9 -34.6L101.7 -36.9L100 -38.8L98.1 -40.5L95.8 -41.7L93.3 -42.4L90.8 -42.7L67.5 -42.7L64.9 -42.4L62.5 -41.7L60.2 -40.5L58.2 -38.8L56.6 -36.9L55.4 -34.6L54.6 -32.1L54.4 -29.5L54.4 -29.5L54.6 -27L55.4 -24.5L56.6 -22.2L58.2 -20.3L60.2 -18.6L62.5 -17.4L64.9 -16.7L67.5 -16.4Z"/></g></g></g></svg><p class="hs-live" aria-live="polite"></p></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="hs-sw" viewBox="0 0 18 14" style="width:18px" aria-hidden="true"><circle class="f-key-disc" cx="9" cy="7" r="6.4"/><path class="f-key" d="M3.08 7a2.29 2.29 0 1 0 4.59 0a2.29 2.29 0 1 0 -4.59 0ZM4.41 7a0.97 0.97 0 1 0 1.93 0a0.97 0.97 0 1 0 -1.93 0ZM7.49 6.28H14.92V8.75H13.77V7.72V7.72H12.92V9.23H11.84V7.72H7.49Z"/></svg>macbook's host key: every Route must present it</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 12 14" style="width:12px" aria-hidden="true"><path class="f-tick" d="M3 12.5L6 10.5M2 7H6"/><path class="f-tick-major" d="M2 13.5L7.5 10M2 2.5H8"/></svg>Direct at 0 ms; the rest at +400 ms, or at once if every Direct Route has failed</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 28 14" style="width:28px" aria-hidden="true"><rect class="f-wash" x="0.5" y="2" width="27" height="10" rx="5"/><text class="f-tag" x="14" y="9.6" text-anchor="middle">In Use</text></svg>the first Route to present that key</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><path class="f-tube-o" d="M20 2V7.5C20 10 18 11 15.5 11H2"/><path class="f-tube-i" d="M20 2V7.5C20 10 18 11 15.5 11H2"/></svg>one SSH connection, whichever Route won</span></span><span class="iso-caption">Each time Heeler connects it races the Host's Routes: Direct Routes start at once, and Overlay Network and Jump Host Routes start together 400 ms later, or as soon as every Direct Route has failed. The first Route whose machine presents the Host's trusted key wins, the rest are cancelled, and Heeler authenticates to the Host once, on that one connection. A different machine answering the same address is turned away by its key, and the list's order never picks the Route.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {

    busy = true;

      W.camThen = null;

  const turn = turnOf(c.t);

    const a = Math.max(angleOfLift(id, liftOf(id, turn)), clearOf(id));
