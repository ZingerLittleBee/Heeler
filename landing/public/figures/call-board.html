<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Who needs you</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}

</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.hs-stage{touch-action:pan-y;position:relative}
.hs-stage:focus{outline:none}
.hs-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.hs-stage [hidden]{display:none}
.hs-live{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* herdr's status colours (Catppuccin): Mocha on dark, the app's Latte inks on light */
.iso{
  --anatomy-red:#f38ba8;--anatomy-green:#a6e3a1;
  --hs-red:#f38ba8;--hs-green:#a6e3a1;--hs-yellow:#f9e2af;--hs-muted:#a6adc8;
  --hs-card:#191919;--hs-card-edge:#2c2c2c;--hs-well:#0c0c0c;--hs-ink:#e9e9e6;
  --hs-slat:#1a1a1a;--hs-slat-lo:#141414;--hs-lamp:#f2f2ee;
  --hs-split:#3e3e3e;--hs-split-fine:#262626;--hs-lens-core:#ffe2ea;
}
.iso[data-theme="light"]{
  --anatomy-red:#c70030;--anatomy-green:#0d7900;
  --hs-red:#c70030;--hs-green:#0d7900;--hs-yellow:#9f5300;--hs-muted:#5c5f77;
  --hs-card:#fdfdfb;--hs-card-edge:#c9c9cb;--hs-well:#d6d6d3;--hs-ink:#1d1d20;
  --hs-slat:#ececE9;--hs-slat-lo:#e2e2df;--hs-lamp:#1b1b1e;
  --hs-split:#d3d3d0;--hs-split-fine:#e9e9e6;--hs-lens-core:#ff9fb3;
}

/* split-flap faces */
.hs-well{fill:var(--hs-well)}
.hs-card-well{fill:var(--hs-card)}
.hs-card{fill:var(--hs-card);stroke:var(--hs-card-stroke,none);stroke-width:.35px;vector-effect:non-scaling-stroke}
.m-ff,.m-fr{--hs-card-stroke:var(--anatomy-mid)}
.hs-mod[data-fade] .m-ff,.hs-mod[data-fade] .m-fr{--hs-card-stroke:none}
.hs-ft{font-family:var(--anatomy-mono);font-weight:600;fill:var(--hs-ink);letter-spacing:.01em}
.hs-plate-name{font-weight:500}
.hs-tag text{font-family:var(--anatomy-mono);font-weight:600;letter-spacing:.04em}
.hs-engrave text{letter-spacing:.18em;font-weight:600}
.hs-g-body{fill:var(--hs-c)}
.hs-g-cut{fill:none;stroke:var(--hs-card);stroke-linecap:round;stroke-linejoin:round}
.hs-g-ring{fill:none;stroke:var(--hs-c);stroke-linecap:round}
.hs-g-dot{fill:var(--hs-c)}
/* glyphs drawn inline on the hood scale their strokes like the ones inside the flaps' <use> */
.iso-svg .hs-g path{vector-effect:none}
/* the split between a flap's two leaves: a gap, not a stroke over the print; counters get a hairline */
.iso-line.hs-hinge{stroke:var(--hs-split)}
.iso-line.hs-hinge-fine{stroke:var(--hs-split-fine);stroke-width:.4px}
.hs-g-q{fill:var(--hs-c);font-family:var(--anatomy-mono);font-weight:700}
.hs-g[data-s="blocked"]{--hs-c:var(--hs-red)}
.hs-g[data-s="done"]{--hs-c:var(--hs-green)}
.hs-g[data-s="working"]{--hs-c:var(--hs-yellow)}
.hs-g[data-s="idle"],.hs-g[data-s="unknown"]{--hs-c:var(--hs-muted)}

.hs-clip-hole{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:.5px;vector-effect:non-scaling-stroke}

/* the one lit accent: the lens of the answer button for the Blocked agent that needs you first */
.hs-lens{fill:var(--hs-red)}
.hs-lens-core{fill:var(--hs-lens-core);opacity:.85}
.hs-halo{fill:none;stroke:var(--hs-red);stroke-width:1.1px;opacity:.55}

/* the roller shutter */
.hs-slat{fill:var(--hs-slat)}
.hs-slat-lo{fill:var(--hs-slat-lo)}

/* lamps: the page writes each lamp's opacity */
.hs-lamp{fill:var(--hs-lamp);opacity:0;pointer-events:none}

/* lines that carry something: SSH (Events) and the relay's push */
.hs-wire .tb-body{transition:fill .5s var(--anatomy-ease)}
.hs-wire[data-hot] .tb-body{fill:var(--anatomy-hi);transition:fill .08s linear}
.hs-wire[data-dead]{opacity:.55;transition:opacity .6s var(--anatomy-ease)}

.hs-row-focus{fill:none;stroke:var(--anatomy-muted);stroke-width:.6px;vector-effect:non-scaling-stroke;pointer-events:none}

@media (max-width:520px){.hs-stage{margin-inline:-6%}.hs-stage svg{width:100%}}

/* legend swatches: the board's own marks, small */
.hs-sw{height:14px;flex:none;overflow:visible}
.hs-sw rect,.hs-sw circle,.hs-sw path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.hs-sw .f-lens{fill:var(--hs-red);stroke:var(--hs-red)}
.hs-sw .f-halo{stroke:var(--hs-red);opacity:.55}
.hs-sw .f-red{fill:var(--hs-red);stroke:none}
.hs-sw text:not(.hs-g-q){fill:var(--anatomy-hi);font:600 8px var(--anatomy-mono)}
.hs-sw .hs-g-body,.hs-sw .hs-g-dot{fill:var(--hs-c);stroke:none}
/* status marks keep the board's weights: ring 0.44 r, cut 0.34 r, at r = 4.6 */
.hs-sw .hs-g-ring{stroke:var(--hs-c);vector-effect:none;stroke-width:2.02px}
.hs-sw .hs-g-cut{stroke:var(--anatomy-page);vector-effect:none;stroke-width:1.56px}
.hs-sw .hs-g-q{fill:var(--hs-c);stroke:none;font-family:var(--anatomy-mono);font-weight:700}
.hs-sw .f-tube-o{stroke-width:3.2px}
.hs-sw .f-tube-i{stroke:var(--anatomy-page);stroke-width:1.4px}

/* phone: the readout wraps onto two lines under the hint instead of running off the card */
@media (max-width:560px){
  .iso-plate.iso-plate{padding-bottom:88px}
  .iso-plate-corner[data-corner="hint"]{bottom:36px}
  .iso-plate-corner[data-corner="readout"]{left:0;white-space:normal;text-align:right;line-height:1.35}
}

a-s="blocked"><circle class="hs-g-body" cx="6" cy="7" r="4.6"/><path class="hs-g-cut" stroke-width="1.56" d="M6 4.61L6 7.46M6 9.12h0.01"/></g><g class="hs-g" data-s="done"><circle class="hs-g-body" cx="18" cy="7" r="4.6"/><path class="hs-g-cut" stroke-width="1.56" d="M15.88 7.09L17.45 8.66L20.12 5.62"/></g><g class="hs-g" data-s="working"><path class="hs-g-ring" stroke-width="2.02" d="M30 3.41A3.59 3.59 0 1 1 26.41 7"/></g><g class="hs-g" data-s="idle"><circle class="hs-g-dot" cx="42" cy="7" r="2.85"/></g><g class="hs-g" data-s="unknown"><text class="hs-g-q" x="54" y="10.95" font-size="11.96" text-anchor="middle">?</text></g></svg>Blocked, Done, Working, Idle, Unknown</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><rect x="6.5" y="3.5" width="9" height="10" rx="1"/><rect x="5.5" y="1" width="11" height="3.4" rx="1.7"/><rect x="9" y="5" width="4" height="7" rx=".6"/><circle cx="11" cy="10.2" r=".7"/></svg>Clip = pinned, above the divider rail</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><path class="f-halo" d="M2.6 10.4A8.6 8.6 0 0 1 19.4 10.4"/><path class="f-lens" d="M6.2 10.6V8.6C6.2 3.4 15.8 3.4 15.8 8.6V10.6Z"/><rect x="3" y="10.6" width="16" height="2.6" rx=".6"/></svg>Lit button = the Blocked agent that needs you first (any Blocked row can be answered)</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><rect x="1" y="1" width="20" height="12" rx="1"/><path d="M1 4.6h20M1 8.2h20M7 11.4h8"/></svg>Shutter = app in the background</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><rect x="3" y="1.5" width="16" height="11" rx="1.2"/><text x="11" y="10.2" text-anchor="middle">20</text></svg>End timer = 20 s grace, then SSH closes</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><circle class="f-red" cx="5" cy="7" r="3.6"/><rect x="11" y="1.5" width="8" height="11" rx="1"/><path d="M11 7h8"/></svg>Hood counters = each Host's Live Activity</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><path class="f-tube-o" d="M2.5 0.8C2.5 5.5 9 4.6 9 8.4"/><path class="f-tube-i" d="M2.5 0.8C2.5 5.5 9 4.6 9 8.4"/><rect x="6.4" y="8.4" width="5.2" height="2.4" rx=".5"/><rect x="5.2" y="10.8" width="7.6" height="2.4" rx=".4"/><rect x="13.5" y="2.4" width="8" height="4.4" rx=".8"/><circle cx="15.2" cy="4.6" r=".5"/></svg>Tagged cable = one SSH connection per Host; junction block = your Hosts</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 22 14" style="width:22px" aria-hidden="true"><rect x="4" y="4" width="14" height="9.5" rx="1"/><path d="M3 4h16M11 4V0"/><circle cx="11" cy="9" r="1.6"/></svg>Sealed box = Push Relay: plugin hook in, hood counters out</span></span><span class="iso-caption">Heeler sorts every agent herdr runs on your Hosts by who needs you: pins, then Blocked, Done, Working, Idle, Unknown. Each Host has one SSH connection and no Heeler server in between; a row moves only when herdr reports the agent's next status (usually Working), never because the app set it. The heeler plugin on each macOS or Linux Host pushes every change through a stateless Push Relay to that Host's Live Activity, and once you leave the app, Blocked and Done also arrive as encrypted alerts; the relay sees counts, never names. After a 20 s grace SSH closes; coming back connects again and loads a fresh inventory.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();

const DROP = D.bar.up - D.bar.down;
function drawShutter() {
  const d = shutter.x;
  const drop = DROP * d;
  bar.setAttribute("transform", d ? `translate(${(D.barStep[0] * drop).toFixed(2)} ${(D.barStep[1] * drop).toFixed(2)})` : "");
  curtain.toggleAttribute("hidden", d < 0.002);
  curtainClip.setAttribute("height", Math.max(0, drop).toFixed(2));
  slats.setAttribute("transform", `translate(0 ${(-DROP * (1 - d)).toFixed(2)})`);
}

const lamps = Object.fromEntries($$(".hs-lamp").map((el) => [el.dataset.lamp, { el, b: el.dataset.lamp === "relay" ? 0 : 1 }]));
let flashAt = -9;
function stepLamps(dt) {
  for (const [name, lamp] of Object.entries(lamps)) {
    let target;
    if (name === "relay") target = clock - flashAt < 0.5 ? 1 : 0;
    else target = lampMode[name] === "connected" ? 1 : lampMode[name] === "connecting" ? (Math.sin(clock * Math.PI * 2) > 0 ? 1 : 0.12) : 0;
    lamp.b = still.matches ? target : lamp.b + (target - lamp.b) * (1 - Math.exp(-dt / 0.06));
    lamp.el.style.opacity = (lamp.b * 0.85).toFixed(3);
  }
}
const wires = $$(".hs-wire");
const hotUntil = {};
function pulse(name, seconds = 0.45) {
  hotUntil[name] = clock + seconds;
  if (name === "relay") flashAt = clock; // the relay's lamp blinks on every push through it
}
function drawWires() {
  for (const g of wires) {
    const name = g.dataset.wire;
    g.toggleAttribute("data-hot", (hotUntil[name] ?? -1) > clock);
    g.toggleAttribute("data-dead", name.startsWith("ssh.") && !app.connected);
  }
}

// ---------------------------------------------------------------- events on a clock
let clock = 0;
let events = [];
const later = (seconds, fn, tag = "") => events.push({ at: clock + seconds, fn, tag });
function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}
function announce(text) {
  announcer.textContent = text;
}
const byId = (id) => agents.find((agent) => agent.id === id);
const word = (status) => STATUS_WORD[status] ?? "Unknown";

// Live Activity counts reach the hood through the Push Relay: the plugin's activity hook waits about 1.5 s.
function pushCounts(host) {
  later(
    1.5,
    () => {
      pulse("relay");
      const counts = countsOf(agents, host);
      flipTo(`c-${host}-blocked`, String(counts.blocked));
      flipTo(`c-${host}-done`, String(counts.done));
      flipTo(`c-${host}-working`, String(counts.working));
      if (!app.foreground) say(`Lock screen · ${host} ! ${counts.blocked} · via Push Relay`);
    },
  );
}
// herdr reports a status. While SSH is up the board flips from the live Events stream; the plugin's hooks
// push through the relay on every change whatever the app is doing, and once the app has left the
// foreground (grace period included) a Blocked or Done change also becomes a lock-screen alert.
function report(id, status) {
  const agent = byId(id);
  if (!agent || agent.status === status) return;
  agent.status = status;
  pushCounts(agent.host);
  if (app.connected) {
    pulse(`ssh.${agent.host}`);
    showBoard(sortAgents(agents));
    const slot = shown.findIndex((a) => a.id === id);
    const pins = shown.filter((a) => a.pin).length;
    if (!app.foreground) say(`herdr reports ${agent.name} → ${word(status)} · board flips behind the shutter`);
    else if (status === "blocked") say(`${agent.name} · ${agent.host} → Blocked · ${agent.pin ? "pinned, stays on top" : pins ? "first after Pins" : "at the top"}`);
    else say(`herdr reports ${agent.name} → ${word(status)} · row ${slot + 1}`);
    announce(`${agent.name} on ${agent.host} is ${word(status)}`);
  }
  if (!app.foreground && (status === "blocked" || status === "done")) {
    // the notify hook waits about 5 s, then an encrypted alert goes through the same relay
    later(3.2, () => {
      pulse("relay", 0.6);
      say(`Alert · ${agent.name} ${word(status)} · encrypted, via Push Relay`);
    });
  }
}
function answer(row) {
  const agent = shown[row];
  if (!agent || agent.status !== "blocked" || !app.connected) return false;
  buttons[row].target = 1;
  later(0.14, () => (buttons[row].target = 0));
  say(`answered ${agent.name} in the live terminal · waiting for herdr`);
  announce(`Answered ${agent.name}`);
  // the app does not set Working: herdr reports it once the agent runs again
  later(1.6, () => report(agent.id, "working"));
  return true;
}
function demoBlock(row) {
  const agent = shown[row];
  if (!agent || !app.connected || agent.status === "blocked") return;
  say(`demo · herdr reports ${agent.name} · ${agent.host} Blocked`);
  later(0.6, () => report(agent.id, "blocked"));
}
function togglePin(row) {
  const agent = shown[row] && byId(shown[row].id);
  if (!agent || !app.connected) return;
  agent.pin = agent.pin ? 0 : ++pinClock;
  showBoard(sortAgents(agents));
  say(agent.pin ? `Pinned ${agent.name} · newest pin first` : `Unpinned ${agent.name} · back to ${word(agent.status)}`);
}
// The Background Grace Period: 20 s by default, played here in about 2 s on the timer at the hood's end.
const GRACE = 20;
const GRACE_PLAY = 2.2;
// counting down turns the drums forward; the reset back to 20 crossfades, so the tens never read 90…30 on the way
function setGrace(n, { reset = false } = {}) {
  flipTo("g1", String(Math.floor(n / 10)), 0, { cross: reset });
  flipTo("g0", String(n % 10), 0.02, { cross: reset });
}
function leave() {
  if (!app.foreground) return;
  app.foreground = false;
  shutter.target = 1;
  say(`Background · SSH held for the ${GRACE} s grace`);
  announce("App in the background, SSH held for the grace period");
  lightButton();
  events = events.filter((e) => e.tag !== "grace" && e.tag !== "return");
  // reduced motion counts in fives; otherwise every second shows
  const every = still.matches ? 5 : 1;
  for (let n = GRACE - every; n >= 0; n -= every) later(((GRACE - n) / GRACE) * GRACE_PLAY, () => setGrace(n), "grace");
  later(GRACE_PLAY + 0.05, () => {
    if (app.foreground) return;
    app.connected = false;
    lampMode.macbook = lampMode.devbox = "suspended";
    lightButton();
    say("Grace over · SSH closed · Console waits for your return");
    announce("SSH closed");
  }, "grace");
}
function back() {
  if (app.foreground) return;
  app.foreground = true;
  shutter.target = 0;
  events = events.filter((e) => e.tag !== "grace");
  setGrace(GRACE, { reset: true });
  if (app.connected) {
    say("Back within the grace period · still connected");
    lightButton();
    return;
  }
  // a return from Suspended is a new activation: Connecting, then Connected with the inventory loading,
  // then the first snapshot replaces each Host's rows whole
  app.loading = true;
  blankBoard();
  lampMode.macbook = lampMode.devbox = "connecting";
  say("Connecting · Agents unknown until the first snapshot");
  announce("Connecting");
  later(1.2, () => {
    app.connected = true;
    lampMode.macbook = lampMode.devbox = "connected";
    pulse("ssh.macbook");
    pulse("ssh.devbox");
    say("Connected · loading Agents");
    announce("Connected");
  }, "return");
  later(1.9, () => {
    app.loading = false;
    showBoard(sortAgents(agents), { together: true });
  }, "return");
  later(2.6, () => {
    say("Fresh inventory · each Host's rows replaced whole");
    announce("Agents loaded");
  }, "return");
}

// ---------------------------------------------------------------- the idle tour
// The tour starts and ends on the resting board: claude Blocked first under the pinned row, its button lit.
const REST = "claude · macbook → Blocked · first after Pins";
const rowOf = (id) => shown.findIndex((a) => a && a.id === id);
const TOUR = [
  [0, () => say(REST)],
  [0.8, () => answer(rowOf("claude"))],
  [8.0, () => leave()],
  [11.8, () => report("droid", "blocked")],
  [17.8, () => back()],
  [21.6, () => answer(rowOf("droid"))],
  [25.6, () => report("claude", "blocked")],
];
const LOOP = 30;
let touring = !still.matches;
let tourAt = 0;
let idleTimer = 0;
function startTour() {
  // come back to the starting board before the loop begins
  events = events.filter((e) => e.tag !== "tour");
  const reset = JSON.stringify(agents) !== JSON.stringify(S0) || !app.foreground;
  if (!app.foreground) back();
  setGrace(GRACE, { reset: true });
  agents = cloneAgents(S0);
  pinClock = 1;
  if (reset && app.connected) showBoard(sortAgents(agents), { together: true });
  for (const host of HOSTS) {
    const counts = countsOf(agents, host);
    for (const [kind, n] of Object.entries(counts)) flipTo(`c-${host}-${kind}`, String(n));
  }
  tourAt = clock + (reset ? 1.2 : 0);
  TOUR.forEach(([t, fn]) => events.push({ at: tourAt + t, fn, tag: "tour" }));
  events.push({ at: tourAt + LOOP, fn: () => touring && startTour(), tag: "tour" });
}
let goRank = -1;
let goDone = 0;
window.heelerFigure = {
  go(target) {
    const rank = { blocked: 0, answer: 1, next: 2 };
    if (!(target in rank)) return;
    touring = false;
    clearTimeout(idleTimer);
    events = events.filter((e) => e.tag !== "tour");
    const want = rank[target];
    if (want === goRank) return run();
    const step = (t, fn) => events.push({ at: t, fn, tag: "step" });
    let t = Math.max(clock + 0.2, goDone);
    let from = goRank;
    if (from < 0 || from > want) {
      // the starting board, as startTour() sets it; pending flips of the old board are dropped
      events = events.filter((e) => e.tag === "grace" || e.tag === "return");
      const moved = JSON.stringify(agents) !== JSON.stringify(S0) || !app.foreground;
      if (!app.foreground) back();
      setGrace(GRACE, { reset: true });
      agents = cloneAgents(S0);
      pinClock = 1;
      if (moved && app.connected) showBoard(sortAgents(agents), { together: true });
      for (const host of HOSTS) {
        const counts = countsOf(agents, host);
        for (const [kind, n] of Object.entries(counts)) flipTo(`c-${host}-${kind}`, String(n));
      }
      t = clock + (!app.connected || app.loading ? 3.0 : moved ? 1.2 : 0.2);
      step(t, () => {
        say(REST);
        lightButton();
      });
      from = 0;
    }
    if (want >= 1 && from < 1) {
      step(t + 1.4, () => answer(rowOf("claude")));
      t += 1.4 + 2.4;
    }
    if (want >= 2 && from < 2) {
      step(t + 0.8, () => report("droid", "blocked"));
      t += 0.8 + 1.0;
    }
    goRank = want;
    goDone = t;
    run();
  },
};
function steer() {
  if (touring) {
    touring = false;
    events = events.filter((e) => e.tag !== "tour");
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    startTour();
    run();
  }, 6000);
  run();
}

// ---------------------------------------------------------------- pointer and keys
const inv = (m, x, y) => {
  const [a, b, c, d, e, f] = m;
  const det = a * d - b * c;
  return [(d * (x - e) - c * (y - f)) / det, (-b * (x - e) + a * (y - f)) / det];
};
function faceAt(event, matrix) {
  const pt = svg.createSVGPoint();
  pt.x = event.clientX;
  pt.y = event.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const [u, v] = inv(matrix, p.x, p.y);
  return { u, z: -v };
}
function hit(event) {
  const { u, z } = faceAt(event, D.face);
  // the bar's drawn outline plus padding, at least 10 css px each side on a phone; at rest the top row and the plates keep their own targets
  const barZ = D.bar.up - DROP * shutter.x;
  const pad = Math.max(2.5, 10 / Math.abs(D.face[3] * svg.getScreenCTM().d));
  let lo = barZ + D.bar.band[0] - pad;
  const hi = Math.min(barZ + D.bar.band[1] + pad, D.bar.top);
  if (shutter.x < 0.05) lo = Math.max(lo, D.rows[0][1] + 0.5);
  if (u > D.bar.x[0] && u < D.bar.x[1] && z > lo && z < hi) return { kind: "bar" };
  if (shutter.x > 0.05) return null;
  const row = D.rows.findIndex(([z0, z1]) => z > z0 - 3 && z < z1 + 3);
  if (row < 0 || u < -90 || u > 96) {
    const plate = faceAt(event, D.plate);
    if (plate.z > D.plateZ[0] && plate.z < D.plateZ[1]) {
      if (plate.u > -106 && plate.u < -6) return { kind: "plate", host: "macbook" };
      if (plate.u > 6 && plate.u < 106) return { kind: "plate", host: "devbox" };
    }
    return null;
  }
  return { kind: Math.hypot(u - D.button.x, 0) < D.button.r + 1 ? "button" : "row", row };
}
let focusRow = 0;
function describeRow(row) {
  const agent = shown[row];
  if (!agent) return say(app.loading ? (app.connected ? "Connected · loading Agents" : "Connecting · Agents unknown") : "empty slot");
  const state = agent.pin ? "Pinned, " + word(agent.status) : word(agent.status);
  // you never set a status: tapping a row that is not Blocked plays what herdr would report
  const act = agent.status === "blocked" ? "tap to answer" : "tap to demo a Blocked report";
  say(`${agent.name} · ${agent.host} · ${state} · ${act}`);
}
function describePlate(host) {
  const c = countsOf(agents, host);
  const state = lampMode[host] === "connected" ? "Connected" : lampMode[host] === "connecting" ? "Connecting" : "Suspended";
  say(`${host} · ${state} · Live Activity ! ${c.blocked} ✓ ${c.done} ◯ ${c.working}`);
}
const focusRing = (() => {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("transform", `matrix(${D.face.join(" ")})`);
  g.innerHTML = `<rect class="hs-row-focus" x="-86" y="0" width="182" height="0" rx="2"/>`;
  show(g, false);
  svg.appendChild(g);
  return g;
})();
function showFocus(row) {
  const [z0, z1] = D.rows[row];
  const rect = focusRing.firstChild;
  rect.setAttribute("y", -(z1 + 2.4));
  rect.setAttribute("height", z1 - z0 + 4.8);
  show(focusRing, stage.matches(":focus-visible") && shutter.target === 0);
}
stage.addEventListener("pointermove", (event) => {
  const h = hit(event);
  if (!h) return;
  steer();
  if (h.kind === "row" || h.kind === "button") describeRow(h.row);
  else if (h.kind === "plate") describePlate(h.host);
  else if (h.kind === "bar") say(app.foreground ? "Shutter handle · tap to leave the app" : "Shutter handle · tap to come back");
});
stage.addEventListener("pointerdown", (event) => {
  const h = hit(event);
  if (!h) return;
  steer();
  if (h.kind === "bar") return app.foreground ? leave() : back();
  if (h.kind === "plate") return describePlate(h.host);
  const agent = shown[h.row];
  if (!agent) return;
  if (agent.status === "blocked") answer(h.row);
  else demoBlock(h.row);
});
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === "ArrowDown" || key === "ArrowUp") {
    focusRow = Math.max(0, Math.min(D.rows.length - 1, focusRow + (key === "ArrowDown" ? 1 : -1)));
    describeRow(focusRow);
    showFocus(focusRow);
  } else if (key === "Enter" || key === " ") {
    const agent = shown[focusRow];
    if (agent && agent.status === "blocked") answer(focusRow);
    else demoBlock(focusRow);
  } else if (key === "p" || key === "P") togglePin(focusRow);
  else if (key === "s" || key === "S") (app.foreground ? leave() : back());
  else return;
  event.preventDefault();
  steer();
});
stage.addEventListener("focus", () => {
  showFocus(focusRow);
  announce(readout.textContent);
});
stage.addEventListener("blur", () => show(focusRing, false));

// ---------------------------------------------------------------- the loop
let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const due = events.filter((e) => e.at <= clock);
  if (due.length) {
    events = events.filter((e) => e.at > clock);
    due.sort((a, b) => a.at - b.at).forEach((e) => e.fn());
  }
  let busy = touring || events.length > 0;
  for (const m of Object.values(mods)) busy = stepModule(m, dt) || busy;
  for (const s of springs) busy = stepSpring(s, dt) || busy;
  drawShutter();
  clipEls.forEach((el, row) => {
    const x = clips[row].x;
    const lift = 1 - Math.min(1, x);
    el.setAttribute("transform", lift > 1e-3 ? `translate(${(D.clipLift[0] * lift).toFixed(2)} ${(D.clipLift[1] * lift).toFixed(2)})` : "");
    el.style.opacity = x >= 1 ? "" : Math.max(0, Math.min(1, x * 1.6)).toFixed(3);
    if (clips[row].target === 0 && x < 0.01) show(el, false);
  });
  {
    const z = divider.x * D.rowPitch;
    dividerEl.setAttribute("transform", z ? `translate(${(D.barStep[0] * z).toFixed(2)} ${(D.barStep[1] * z).toFixed(2)})` : "");
  }
  buttonEls.forEach((el, row) => {
    const x = buttons[row].x;
    el.setAttribute("transform", x ? `translate(${(D.press[0] * x).toFixed(2)} ${(D.press[1] * x).toFixed(2)})` : "");
  });
  stepLamps(dt);
  drawWires();
  busy = busy || lampMode.macbook === "connecting" || Object.values(hotUntil).some((t) => t > clock) || clock - flashAt < 1;
  if (shutter.target > 0) show(focusRing, false);
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
if (touring) startTour();
lightButton();
</script></body></html>
