.iso{
  --hs-red:#f38ba8;--hs-green:#a6e3a1;--hs-yellow:#f9e2af;--hs-muted:#a6adc8;--hs-blue:#89b4fa;
  --hs-card:#191919;--hs-well:#0c0c0c;--hs-ink:#e9e9e6;--hs-dim:#9a9a96;
  --hs-glass:#090909;--hs-field:#151515;--hs-lamp:#f2f2ee;--hs-bore:#030303;
}
.iso[data-theme="light"]{
  --hs-red:#c70030;--hs-green:#0d7900;--hs-yellow:#9f5300;--hs-muted:#5c5f77;--hs-blue:#1e66f5;
  --hs-card:#fdfdfb;--hs-well:#d6d6d3;--hs-ink:#1d1d20;--hs-dim:#55554f;
  --hs-glass:#cfcfcc;--hs-field:#ececE9;--hs-lamp:#1b1b1e;--hs-bore:#5e5e5b;
}

.hs-well{fill:var(--hs-well)}
.hs-card-well{fill:var(--hs-card)}
.hs-cubby{fill:var(--hs-bore)}
.hs-ft{font-family:var(--anatomy-mono);font-weight:600;fill:var(--hs-ink);letter-spacing:.01em}
.hs-plate-name{font-weight:500}
.hs-engrave{letter-spacing:.08em;font-weight:700;fill:var(--anatomy-hi)}

.hs-lamp-glow{fill:var(--hs-lamp);opacity:var(--hs-ssh,.85);pointer-events:none;transition:opacity .2s linear}
.hs-lamp-core{fill:#fff;opacity:var(--hs-ssh,.85);pointer-events:none;transition:opacity .2s linear}

/* moving flat parts: the lever, its knee, the arm and the latch's hook, a face and its edge */
.hs-plate-side{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-plate-face{fill:var(--anatomy-shade-0);stroke:var(--anatomy-hi);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-slot{fill:var(--hs-bore);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-screw{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-pad{fill:var(--anatomy-shade-2)}
/* the rod and the arm's link: round bars, drawn as their silhouettes */
.hs-rod-body{fill:var(--anatomy-shade-0);stroke:var(--anatomy-hi);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-pin{fill:var(--anatomy-hi)}
.hs-bedmark{fill:var(--hs-well);fill-opacity:.55}
.hs-gate-side{fill:var(--anatomy-shade-1);stroke:var(--anatomy-hi);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}

/* type: sorts print their letter in the paper's ink; the slug is the one lit part */
.hs-type{fill:var(--hs-ink);font-weight:700}
.hs-slug-face{fill:var(--anatomy-lit)}
.hs-slug-text{fill:var(--anatomy-paper);font-weight:700;letter-spacing:-.01em}
.hs-sort[data-off],.hs-quad[data-off],.hs-slug[data-off]{opacity:0}

/* the parcel's label: a paper slip with the photo mark and the file's name */
.hs-label{fill:var(--hs-card);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-label-text{font-weight:700}
.hs-photo-frame{fill:none;stroke:var(--hs-ink);stroke-width:.5px;vector-effect:non-scaling-stroke}
.hs-photo-ink{fill:var(--hs-ink)}

.hs-keyhole{fill:var(--hs-bore)}

/* the phone: claude's Agent detail, the Composer under its terminal */
.hs-glass{fill:var(--hs-glass)}
.hs-term{fill:var(--hs-well);stroke:var(--anatomy-lo);stroke-width:.35px;vector-effect:non-scaling-stroke}

.hs-title{font-weight:700}
.hs-draft{font-weight:600}
.hs-placeholder{fill:var(--hs-ink);fill-opacity:.7;font-weight:500}
.hs-bar{fill:var(--hs-ink);font-weight:600}
.hs-caret{fill:var(--hs-blue)}
.hs-cursor{fill:var(--hs-ink)}
.hs-btn{fill:var(--hs-card);stroke:var(--anatomy-mid);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-glyph{fill:none;stroke:var(--hs-ink);stroke-width:.7px;stroke-linecap:round;vector-effect:non-scaling-stroke}

.hs-chevron{fill:none;stroke:var(--hs-ink);stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}

.hs-enter-mark{fill:none;stroke:var(--hs-ink);stroke-width:.7px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* claude's board: Fig 1's status glyphs; Idle a small dot, Working an open ring, Blocked a red disc with "!" */
.hs-board-well{fill:var(--hs-well)}
.hs-board-name{font-weight:700}
.hs-board-status{font-weight:600}
.hs-board-ft{font-weight:600}
.hs-g-body{fill:var(--hs-c)}
.hs-g-cut{fill:none;stroke:var(--hs-well);stroke-linecap:round;stroke-linejoin:round}
.hs-g-ring{fill:none;stroke:var(--hs-c);stroke-linecap:round}
.hs-g-dot{fill:var(--hs-c)}

.hs-rope{fill:none;stroke:var(--anatomy-hi);stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linecap:round}

</style><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 4</span><span class="iso-plate-corner" data-corner="title">Write, then Send</span><span class="iso-plate-corner" data-corner="hint">Pull the lever, or press Add</span><span class="iso-plate-corner" data-corner="readout" data-readout>The draft stays on the phone until Send</span></div><div class="iso-stage hs-stage" tabindex="0" role="group" aria-roledescription="letterpress bench" aria-label="How Heeler's Composer sends a draft and adds a photo. Space or a tap on the lever sends the draft in the composing stick; A or a tap on the Add pendant beside the phone stages a photo on macbook and sets its path into the line; the arrow keys move between the phone, the Add pendant, the stick, the path slug, the lever, the rod, the gate, the lift, the galley, the impression arm, the hook, the pigeonhole, claude's board, the SSH line and the Host."><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 600 320" role="img" aria-label="A letterpress bench read left to right. On the left a phone stands in its dock showing claude's Agent detail with no title, only a Back button floating on glass: a live terminal whose last output reads Fixed the header over an empty prompt, an attachment bar reading Image path inserted and copied with Dismiss, and the Composer, which opens with claude's Idle status line, holds the draft match /var/folders/…/T/heeler.k3x9Qa2m/stage-1b6e…/image.jpg with a caret after the trailing space, then Add, More and a Send arrow, with claude's switcher chip below. Beside the phone an Add pendant hangs from a clamp on the beam on a cable, a plus button over the word Add. The dock's bed carries a brass composing stick in which the same draft is set in type: five sorts spelling match, a space, and one lit slug cast with …/T/heeler.k3x9…/image.jpg, then a space and the setting rule. At the stick's end, under the pigeonhole, stands a lever with the Send arrow on its knob; it pulls toward the phone. Its crank draws a bright rod with forked ends along the front of the bench; the rod lifts a shutter hinged at the top across the galley's mouth where it enters the Host, now closed. The galley runs into the Host's open bay to a solid press bed engraved with the line's landing, under claude's board; a raised impression arm with a padded platen and a return mark waits over the bed; at the rod's far end a hook rests over the pin of a bell crank linked to the arm. Above the bay, reaching out over the stick's end, one pigeonhole under a band engraved /var/folders/…/T/ and a tag reading heeler.k3x9Qa2m/ stage-1b6e…/ holds a parcel labelled image.jpg with a photo mark. To its right, claude's board shows an Idle dot and the same rows as the phone's terminal, under a hood with macbook's plate; a lintel to the right carries herdr's plate. A channel beam runs low from the dock's spine over the phone to a post on the pigeonhole; a trolley rides it with a platform over a tray on top of the phone. A corrugated SSH line runs along the bench from the dock to the Host."><defs><clipPath id="hs-sink"><path d="M43.6 52.57L179.63 65.91L179.63 -334.09L43.6 -347.43Z"/></clipPath><clipPath id="hs-rise"><path d="M143.38 204.31L351.75 224.74L351.75 24.74L143.38 4.31Z"/></clipPath></defs><path class="iso-halo" d="M36.8 241.3L37.1 240.7L61.8 211.2L62.5 210.6L63.5 210.1L64.8 209.6L66.3 209.3L68 209L69.8 208.9L71.7 208.9L73.5 209L556.4 256.4L558.1 256.6L559.7 256.9L561 257.4L562.1 257.9L562.8 258.5L563.2 259.1L563.2 259.7L563.2 270.8L562.9 271.4L538.2 300.9L537.5 301.5L536.5 302L535.2 302.5L533.7 302.8L532 303.1L530.2 303.2L528.3 303.2L526.5 303.1L43.6 255.7L41.9 255.5L40.3 255.2L39 254.7L37.9 254.2L37.2 253.6L36.8 253L36.8 252.4Z"/><g class="iso-solid"><path class="iso-fill" d="M71.2 227.1L71.5 226.5L72.2 225.9L73.2 225.4L74.5 224.9L76 224.6L77.7 224.3L79.5 224.2L81.4 224.2L83.2 224.3L84.9  class="iso-caption">You write to an Agent in Heeler's Composer, and the draft stays on your phone until you tap Send. Send delivers the whole draft at once: one herdr agent.prompt that types it into the Agent's pane and presses Enter, or, while the Agent is Blocked, the text alone, typed into the live terminal, with Enter left to you. Add Image first copies the photo over SFTP into a new private folder on the Host, which Heeler never cleans up, and puts only its absolute path and a space into the draft.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;

  set("carZ", 0);
  set("carP", 0);
  set("sink", 0);
  set("sh", 0);
  set("c", 1);
  set("cap", 0);
  set("hose", -1);
  set("fade", 1);
  set("tagA", 1);
  set("lift", 0);
  Object.assign(S, { fi: 0, status: "idle", phoneStatus: "idle", tools: false, blocked: false });
  Object.assign(S, { draft: fullDraft(), pane: PANE.rest(), bar: BAR.done() });
  rack();
  claude();
}

// ---------------------------------------------------------------- Send: one pull of the lever
// The pull runs in two parts. To the hold, the crank draws the rod toward the phone: its finger swings the gate up and
// the follower runs the line along the galley, while the hook's jaw travels free toward the bell crank's pin. The last
// part of the stroke takes up the jaw on the pin: the bell crank turns, the link pulls the arm's tab, the arm comes
// down on the line. While claude is Blocked the hook is lifted, so the same stroke delivers the line without its Enter.
function pulse(dur, delay = 0) {
  at(delay, () => {
    set("hose", 0);
    to("hose", 1.25, dur, linear);
  });
  at(delay + dur, () => set("hose", -1));
}
function send(blocked = S.status === "blocked") {
  if (acting()) return;
  if (!S.draft.trim()) {
    tell(SAY.empty);
    return;
  }
  const shift = D.line.bed - D.line.x0;
  flash(P.send);
  S.draft = "";
  phone();
  tell(blocked ? SAY.blockedSend : SAY.pull);
  to("ruleA", 0, 0.15);
  to("lever", D.lever.hold, 0.45, easeIn);
  at(0.45, () => {
    seatForme();
    to("formeX", shift, 1.4, easeInOut);
  });
  pulse(1.4, 0.45);
  at(1.0, () => {
    set("ruleX", ruleAfter(0));
    to("ruleA", 1, 0.3);
  });
  at(1.85, () => {
    S.pane = blocked ? PANE.blockedTyped() : PANE.typed();
    claude();
    if (!blocked) tell(SAY.arrive);
  });
  // the end of the stroke: the hook takes the bell crank's pin (or, lifted, passes over it)
  at(1.95, () => to("lever", D.lever.pull, 0.18, easeIn));
  at(2.25, () => to("lever", 0, 0.8, easeOut));
  if (blocked) {
    at(2.8, () => {
      S.tools = true;
      to("lift", 1, 0.3);
      phone();
      tell(SAY.blockedWait, "Typed, not submitted: Enter or Esc is one tap on the tools keyboard");
    });
    return;
  }
  impressed(2.13);
}
// after the impression: Enter is pressed and the line is spent; herdr reports claude Working a moment later, by event
function impressed(delay) {
  const byHand = S.blocked;
  at(delay, () => {
    S.pane = PANE.submitted();
    if (S.tools) to("lift", 0, 0.3);
    S.tools = false;
    claude();
    tell(byHand ? SAY.enter : SAY.impress);
  });
  at(delay + 0.6, () => {
    S.pane = PANE.working();
    report("working");
  });
  at(delay + 1.4, () => {
    tell(SAY.working);
    to("formeA", 0, 0.6);
  });
  at(delay + 2.2, () => {
    restoreAll();
    D.line.pieces.forEach((_, i) => set(`p${i}`, 0));
    set("formeX", 0);
    set("formeA", 1);
  });
  // the draft cleared at the tap; Enter by hand follows a Send whose readout already said so
  if (!byHand) at(delay + 3.0, () => tell(SAY.cleared));
  at(delay + 4.6, () => tell(SAY.stays, "image.jpg stays on macbook; only its path went to claude"));
  at(delay + 6, () => {
    S.blocked = false;
  });
}
// Enter by hand: the ⏎ boss pressed, the arm down without the rod; then the hook drops back onto the pin
function enter() {
  if (!S.tools) return;
  flash(P.phoneEnter);
  to("boss", 1, 0.1, easeIn);
  at(0.16, () => to("boss", 0, 0.3));
  to("press", 1, 0.14, easeIn);
  at(0.2, () => to("press", 0, 0.8, easeInOut));
  at(1.1, () => to("hook", 0, 0.35, easeIn));
  impressed(0.14);
}

// ---------------------------------------------------------------- typing: sorts drop into the stick, nothing leaves
function type(start = 0) {
  at(start, () => tell(SAY.typing));
  const chars = `${WORDS} `;
  WORD.forEach((i, n) => {
    at(start + 0.25 + n * 0.2, () => {
      to(`p${i}`, 1, 0.22, easeOut);
      to("ruleX", ruleAfter(i + 1), 0.16, easeOut);
      S.draft = chars.slice(0, n + 1);
      phone();
    });
  });
  return start + 0.25 + WORD.length * 0.2 + 0.4;
}

// ---------------------------------------------------------------- Add: the file goes to macbook first, its path into the line
function add() {
  if (acting()) return;
  const typed = WORD.every((i) => V[`p${i}`] > 0.5) && !hasSlug() && !V[`p${LAST}`];
  if (typed) return addChain(0);
  if (hasSlug()) {
    // from a line that already carries a path: cut to the draft "match ", then run the Add from there; the chain is
    // scheduled after rest(), which clears every pending beat
    crossfade(() => {
      rest();
      D.line.pieces.forEach((_, i) => set(`p${i}`, i < SLUG_I ? 1 : 0));
      set("ruleX", ruleAfter(SLUG_I));
      S.draft = `${WORDS} `;
      claude();
      addChain(0.4);
    });
    return;
  }
  addChain(type());
}
function addChain(t) {
  const x = D.hoist.cubby;
  at(t, () => {
    set("cap", 0);
    to("cap", 1, 0.1, easeIn);
    flash(P.phoneAdd);
    S.bar = BAR.preparing();
    phone();
    tell(SAY.preparing, "Preparing Image: re-encoded, at most 4096 pixels on its long edge, at most 16 MiB");
    // every Add makes its own folder: the pigeonhole and its tag clear for this one
    to("c", 0, 0.4);
    to("tagA", 0, 0.4);
  });
  at(t + 0.14, () => to("cap", 0, 0.3));
  at(t + 0.5, () => {
    S.fi += 1;
    rack();
  });
  at(t + 0.9, () => to("carP", 1, 0.35));
  at(t + 1.5, () => {
    moveItem(P.car);
    if (P.cable) moveItem(P.cable);
    to("carZ", D.hoist.lift, 0.45);
  });
  const travel = 2.6;
  at(t + 1.95, () => {
    to("carX", x, travel, easeInOut);
    up.on = true;
    up.last = -1;
  });
  pulse(travel / 2, t + 1.95);
  pulse(travel / 2, t + 1.95 + travel / 2);
  at(t + 1.95 + travel - 0.7, () => to("sh", 1, 0.45));
  at(t + 1.95 + travel, () => to("carZ", D.hoist.land - D.hoist.z, 0.5, easeOut));
  at(t + 2.5 + travel, () => to("sink", 1, 0.55, easeIn));
  at(t + 3.05 + travel, () => {
    up.on = false;
    set("carP", 0);
    set("sink", 0);
    set("c", 0.001);
    to("c", 1, 0.34, easeIn);
    to("tagA", 1, 0.34);
    to("sh", 0, 0.4);
    tell(SAY.shelved);
  });
  // the rule moves aside first, then the slug rises and the space after it drops in: the path and one space, at once
  const back = t + 3.6 + travel;
  at(back, () => {
    to("ruleX", ruleAfter(LAST + 1), 0.3, easeOut);
    to("carZ", D.hoist.lift, 0.4);
  });
  at(back + 0.3, () => {
    to(`p${SLUG_I}`, 1, 0.6, easeOut);
    to(`p${LAST}`, 1, 0.3, easeOut);
    S.draft = fullDraft();
    S.bar = BAR.done();
    phone();
    tell(SAY.inserted);
  });
  at(back + 0.45, () => to("carX", D.hoist.x, 2.3, easeInOut));
  at(back + 2.8, () => to("carZ", 0, 0.4, easeOut));
  at(back + 2.2, () => tell(SAY.inserted2));
  at(back + 3.3, () => {
    restoreItem(P.car);
    if (P.cable) restoreItem(P.cable);
  });
}
// the completed status keeps its Dismiss and no timer: in the tour the reader taps it
function dismiss() {
  if (!S.bar || S.bar.cmd !== PROGRESS.dismiss) return;
  P.barCmd.toggleAttribute("data-press", true);
  at(0.28, () => {
    P.barCmd.toggleAttribute("data-press", false);
    S.bar = null;
    phone();
  }, "fx");
}
// the upload's progress follows the car along the beam (the copy is ComposerStagingStore's)
const up = { on: false, last: -1 };
function upload() {
  if (!up.on) return;
  const x0 = D.hoist.x;
  const x1 = D.hoist.cubby;
  const p = clamp01((val("carX") - x0) / (x1 - x0));
  const pct = val("sink") > 0.5 ? 100 : Math.min(99, Math.round(p * 95));
  if (pct === up.last) return;
  up.last = pct;
  S.bar = BAR.uploading(pct);
  phone();
  say(SAY.uploading(pct));

// ---------------------------------------------------------------- Blocked: the hook lifts off the bell crank; Enter is yours
function block() {
  if (acting()) return;
  S.blocked = true;
  S.pane = PANE.blocked();
  report("blocked");
  tell(SAY.blocked);
  to("hook", 1, 0.5, easeOut);

// a cut back to the resting frame, or to the start of an Add
function crossfade(apply, tag = "act") {
  to("fade", 0, 0.32);
  at(0.34, () => {
    apply();
    set("fade", 0);
    to("fade", 1, 0.36);
  }, tag);

// ---------------------------------------------------------------- the linkage
// lever angle (negative: toward the phone) → the crank pin, the rod's travel, the gate, the hook, the bell crank, the arm
const rodAt = (deg) => D.crank.r * (Math.cos(toRad(D.crank.a0)) - Math.cos(toRad(D.crank.a0 - deg)));
function linkage() {
  const lever = val("lever");
  const shift = rodAt(lever);
  const crankPin = [D.lever.pivot[0] + D.crank.r * Math.cos(toRad(D.crank.a0 - lever)), D.lever.pivot[1] + D.crank.r * Math.sin(toRad(D.crank.a0 - lever))];
  const gate = (Math.atan2(shift, D.gate.s) * 180) / Math.PI;
  const hook = val("hook");
  const taken = hook < 0.15 ? clamp01((shift - D.rod.lost) / D.rod.press) : 0;
  const frac = Math.max(taken, val("press"));
  const arm = D.arm.rest * (1 - frac);
  const bell = (Math.asin(Math.min(1, (frac * D.rod.press) / D.bell.lower)) * 180) / Math.PI;
  return { lever, shift, crankPin, gate, hook: hook * D.hook.lift, arm, bell };
}

// ---------------------------------------------------------------- drawing
const knobRest = D.lever.knob;
const knobLocal = [0, knobRest[2] - D.lever.pivot[1]];
const armPin = [D.arm.px, D.arm.pz];
const bellPin = [D.bell.x, D.bell.z];
const tipRest = rotAbout(armPin, D.arm.rest)(D.arm.tip);
const lowRest = [D.bell.x, D.bell.z - D.bell.lower];
const plateEls = Object.fromEntries(Object.keys(D.plates).map((name) => [name, $$(`[data-p="${name}"]`)]));
function plate(name, deg, pin) {
  const p = D.plates[name];
  const turn = rotAbout(pin ?? p.pin, deg);
  const els = plateEls[name];
  p.parts.forEach((part, i) => {
    const pts = part.map(turn);
    const sil = convexHull([...pts.map(([x, z]) => abs([x, p.y0, z])), ...pts.map(([x, z]) => abs([x, p.y1, z]))]);
    els[i].setAttribute("d", polyOf(sil));
  });
  (p.faces ?? [p.parts[0]]).forEach((face, i) => els[p.parts.length + i].setAttribute("d", onFace(face.map(turn), p.y1)));
}
// a round bar between two points of the xz plane at depth y, as its silhouette
function capsule(a, b, y, r) {
  const [dx, dz] = [b[0] - a[0], b[1] - a[1]];
  const len = Math.hypot(dx, dz) || 1;
  const [ux, uz] = [dx / len, dz / len];
  const out = [];
  for (const [x, z] of [a, b]) for (let i = 0; i < 12; i++) {
    const t = (i / 12) * 2 * Math.PI;
    out.push(abs([x - r * Math.cos(t) * uz, y + r * Math.sin(t), z + r * Math.cos(t) * ux]));
  }
  return polyOf(convexHull(out));
}
function draw() {
  const L = linkage();
  plate("handle", L.lever);
  plate("crank", L.lever);
  const k = rotAbout(D.lever.pivot, L.lever)(knobLocal);
  P.knob.setAttribute("transform", translate([k[0] - knobRest[0], 0, k[1] - knobRest[2]]));
  // the rod and the pieces it carries
  const right = [D.rod.x1 - L.shift, D.rod.z];
  P.rod.setAttribute("d", capsule(L.crankPin, right, D.rod.y, D.rod.r));
  plate("clevis0", 0, L.crankPin);
  plate("clevis1", 0, right);
  plate("finger", 0, [D.plates.finger.pin[0] - L.shift, D.rod.z]);
  plate("hook", L.hook, right);
  plate("gate", L.gate);
  plate("gatecrank", L.gate);
  // the bell crank, its pin, the link and the arm
  plate("bell", L.bell);
  const low = rotAbout(bellPin, L.bell)([0, -D.bell.lower]);
  P.bellPin.setAttribute("transform", translate([low[0] - lowRest[0], 0, low[1] - lowRest[1]]));
  plate("arm", L.arm);
  const upper = rotAbout(bellPin, L.bell)([0, D.bell.upper]);
  const tab = rotAbout(armPin, L.arm)(D.arm.tab);
  P.link.setAttribute("d", capsule(upper, tab, D.link.y, D.link.r));
  const tip = rotAbout(armPin, L.arm)(D.arm.tip);
  P.enter.setAttribute("transform", translate([tip[0] - tipRest[0], -1.2 * val("boss"), tip[1] - tipRest[1]]));
  // the line
  P.forme.setAttribute("transform", translate([val("formeX"), 0, 0]));
  P.forme.style.opacity = f2(val("formeA"));
  P.pieces.forEach((el, i) => {
    const v = val(`p${i}`);
    off(el, v <= 0.002);
    if (i === SLUG_I) el.setAttribute("transform", translate([0, 0, -(1 - v) * (D.typeH + 1.5)]));
    else {
      el.setAttribute("transform", translate([0, 0, (1 - v) * 11]));
      el.style.opacity = f2(Math.min(1, v * 2.5));
    }
  });
  P.rule.setAttribute("transform", translate([val("ruleX") - D.line.rule, 0, 0]));
  P.rule.style.opacity = f2(val("ruleA"));
  // the lift
  const dx = val("carX") - D.hoist.x;
  const dz = val("carZ");
  P.car.setAttribute("transform", translate([dx, 0, dz]));
  P.trolley.setAttribute("transform", translate([dx, 0, 0]));
  const top = abs([D.hoist.x, D.hoist.ropeY, D.hoist.drum - dz]);
  const eye = abs([D.hoist.x, D.work, D.hoist.eye]);
  P.rope.setAttribute("d", `M${f2(top[0])} ${f2(top[1])}L${f2(eye[0])} ${f2(eye[1])}`);
  const carP = val("carP");
  off(P.carParcel, carP <= 0.002);
  P.carParcel.style.opacity = f2(carP);
  P.sink.setAttribute("transform", translate([0, 0, -val("sink") * D.hoist.sink]));
  P.shutter.setAttribute("transform", translate([0, val("sh") * D.hoist.shutter, 0]));
  const c = val("c");
  off(P.parcel, c <= 0);
  P.parcel.style.opacity = f2(clamp01(c * 3));
  P.parcel.setAttribute("transform", translate([0, 0, (1 - c) * D.hoist.drop]));
  P.cap.setAttribute("transform", translate([0, -1.2 * val("cap"), 0]));
  const tagA = f2(clamp01(val("tagA")));
  for (const el of P.tag) el.style.opacity = tagA;
  P.composer.setAttribute("transform", `translate(0 ${f2(-val("lift") * D.phone.lift)})`);
  // the SSH line: a lit stretch runs from the phone to the Host
  const h = val("hose");
  P.hose.forEach((els, i) => {
    const hot = h >= 0 && Math.abs(i / Math.max(1, D.hose - 1) - (h - 0.12)) < 0.12;
    for (const el of els) el.toggleAttribute("data-hot", hot);
  });
  boardG.style.opacity = f2(val("fade"));
  upload();
}

// ---------------------------------------------------------------- the idle tour
const TOUR = [
  [0.8, () => send(false)],
  [10.4, () => type()],
  [12.6, () => add()],
  [24.2, () => dismiss()],
  [25.6, () => block()],
  [27.4, () => send(true)],
  [33.2, () => enter()],
  [40.4, () => crossfade(() => { rest(); tell(SAY.rest); }, "tour")],
  [43.4, null],
];
let touring = !still.matches;
let idleTimer = 0;
function startTour() {
  events = events.filter((e) => e.tag !== "tour");
  for (const [t, fn] of TOUR) if (fn) at(t, fn, "tour");
  at(TOUR[TOUR.length - 1][0], () => touring && startTour(), "tour");
}
let goRank = -1;
let goGen = 0;
window.heelerFigure = {
  go(target) {
    const rank = { type: 0, add: 1, send: 2 };
    if (!(target in rank)) return;
    touring = false;
    clearTimeout(idleTimer);
    events = events.filter((e) => e.tag !== "tour" && e.tag !== "step");
    const want = rank[target];
    if (want === goRank) return kick();
    const gen = ++goGen;
    const beats = [];
    const pump = (pause = 0) => {
      if (gen !== goGen || !beats.length) return;
      if (acting()) return at(0.25, () => pump(1.0), "step");
      if (pause) return at(pause, () => pump(0), "step");
      beats.shift()();
      at(0.25, () => pump(1.0), "step");
    };
    let from = goRank;
    const restart = from < 0 || from > want;
    if (restart) {
      beats.push(() => {
        rest();
        D.line.pieces.forEach((_, i) => set(`p${i}`, 0));
        set("ruleX", ruleAfter(0));
        Object.assign(S, { draft: "", bar: null });
        phone();
        tell(SAY.rest);
        // rest() drops every pending beat but the tour's, this pump's next call included
        pump(0.4);
      });
      from = -1;
    }
    if (from < 0) beats.push(() => type());
    if (want >= 1 && from < 1) beats.push(() => add());
    if (want >= 2 && from < 2) beats.push(() => {
      dismiss();
      at(0.5, () => send(false));
    });
    goRank = want;
    if (restart) beats.shift()();
    else pump(0.2);
    if (still.matches) settleNow();
    else kick();
  },
};
function steer() {
  if (touring) {
    touring = false;
    events = events.filter((e) => e.tag !== "tour");
    // a tour beat left half done (claude Blocked, the hook lifted) settles back where a reader can start from
    if (S.blocked && !acting()) crossfade(() => { rest(); tell(SAY.rest); });
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    if (!acting()) crossfade(() => { rest(); tell(SAY.rest); }, "tour");
    at(0.8, startTour, "tour");
    kick();
  }, 9000);
  kick();
}

// ---------------------------------------------------------------- pointer and keys
const inv = (m, x, y) => {
  const [a, b, c, d, e, f] = m;
  const det = a * d - b * c;
  return [(d * (x - e) - c * (y - f)) / det, (-b * (x - e) + a * (y - f)) / det];
};
function faceAt(event, matrix) {
  const pt = svg.createSVGPoint();
  pt.x = event.clientX;
  pt.y = event.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const [u, v] = inv(matrix, p.x, p.y);
  return { u, z: -v };
}
function hit(event) {
  for (const [region, y, x0, x1, z0, z1] of D.hits) {
    const f = faceAt(event, D.planes[y]);
    if (f.u >= x0 && f.u <= x1 && f.z >= z0 && f.z <= z1) return region;
  }
  return null;
}
function linesOf(region) {
  if (region === "board") {
    const lines = [`claude's pane on macbook · ${STATUS_WORD[S.status]}`, "the phone's live terminal shows the same rows"];
    if (S.pane.kind === "rest") lines.push("Nothing arrives here until you Send");
    else if (S.pane.kind.startsWith("blocked")) lines.push("A dialog is waiting for its answer");
    else lines.push("Only the path text came; the file is in the pigeonhole");
    return lines;
  }
  return PARTS[region] ?? [readout.textContent];
}
let stepTimer = 0;
function stopSteps() {
  clearTimeout(stepTimer);
  stepTimer = 0;
}
let described = null;
function describe(region) {
  if (region === described && stepTimer) return;
  described = region;
  stopSteps();
  const lines = linesOf(region);
  say(lines[0]);
  announce(lines.join(" "));
  let i = 0;
  const next = () => {
    i = (i + 1) % lines.length;
    say(lines[i]);
    stepTimer = i === 0 ? 0 : setTimeout(next, 2400);
  };
  if (lines.length > 1) stepTimer = setTimeout(next, 2400);
}
const REGIONS = D.rings.map(([region]) => region);
let focusIndex = 0;
const focusRing = (() => {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.toggleAttribute("hidden", true);
  svg.appendChild(g);
  return g;
})();
function showFocus(region) {
  const [, boxes] = D.rings.find(([name]) => name === region);
  focusRing.innerHTML = boxes
    .map(([y, x0, x1, z0, z1]) => `<g transform="matrix(${D.planes[y].join(" ")})"><rect class="hs-focus" rx="2.4" x="${x0}" y="${-z1}" width="${x1 - x0}" height="${z1 - z0}"/></g>`)
    .join("");
  focusRing.toggleAttribute("hidden", !stage.hasAttribute("data-kbd"));
}
// only the lever and the Add pendant change anything; every other part describes itself
function press(region) {
  if (region === "lever") {
    if (acting()) return describe("lever");
    send();
    if (still.matches) settleNow();
    return;
  }
  if (region === "add") {
    if (acting()) return describe("add");
    add();
    if (still.matches) settleNow();
    return;
  }
  if (region) describe(region);
}
let pressed = false;
const keyboardFocus = (on) => stage.toggleAttribute("data-kbd", on);
stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  const region = hit(event);
  if (!region) return;
  steer();

stage.addEventListener("pointerdown", (event) => {

  if (event.button > 0) return;
  steer();
  described = null;
  press(hit(event));
});
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === "ArrowDown" || key === "ArrowUp" || key === "ArrowLeft" || key === "ArrowRight") {
    const d = key === "ArrowDown" || key === "ArrowRight" ? 1 : -1;

    describe(REGIONS[focusIndex]);
    showFocus(REGIONS[focusIndex]);
  } else if (key === " ") press("lever");
  else if (key === "Enter") press(stage.hasAttribute("data-kbd") ? REGIONS[focusIndex] : "lever");
  else if (key === "a" || key === "A") press("add");
  else return;
  event.preventDefault();
  steer();
});
stage.addEventListener("focus", () => {
  keyboardFocus(!pressed);
  pressed = false;
  showFocus(REGIONS[focusIndex]);
  announce(readout.textContent);
});
stage.addEventListener("blur", () => {
  pressed = false;
  keyboardFocus(false);
  focusRing.toggleAttribute("hidden", true);
});

// ---------------------------------------------------------------- the loop
function step(dt) {
  clock += dt;
  runEvents();
  return acting() || Object.keys(tw).length > 0 || events.length > 0;
}
// reduced motion: an action jumps to its end; nothing moves on its own
function settleNow() {
  for (let i = 0; i < 4000 && (events.some((e) => e.tag !== "tour") || Object.keys(tw).length); i++) {
    clock += 0.05;
    runEvents();
    for (const key of Object.keys(tw)) val(key);
  }
  draw();
}
let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const busy = step(dt) || touring;
  draw();
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function kick() {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) kick();
}, { rootMargin: "120px 0px" }).observe(stage);
// narrow cards show the story region (the phone, the line of type, the pigeonhole, the arm and the board) larger
const fullBox = svg.getAttribute("viewBox");
new ResizeObserver(() => {
  const narrow = stage.clientWidth < 520;
  svg.setAttribute("viewBox", narrow ? D.crop.join(" ") : fullBox);
  stage.toggleAttribute("data-crop", narrow);
}).observe(stage);
// the resting frame: the draft set in the stick with its path slug, the photo already in its pigeonhole on macbook,
// the lever up, claude Idle
rest();
draw();
if (touring) startTour();
</script></body></html>
