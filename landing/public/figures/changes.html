<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>What Changed</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style><meta name="robots" content="noindex"><style>
html,body{height:100%}
body{overflow:hidden}
.iso-page{width:auto;height:100%;margin:0}
.iso-figure{height:100%;margin:0}
.iso-plate{box-sizing:border-box;height:100%;display:flex;flex-direction:column;box-shadow:none}
.iso-plate>.iso-stage{flex:1 1 auto;min-height:0;display:flex}
.iso-plate .iso-svg{width:100%;height:100%;margin:0}
.iso-legend{display:none}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.hs-stage{touch-action:pan-y;position:relative;cursor:pointer}
.hs-stage:focus{outline:none}
.hs-stage[data-kbd]:focus-visible{outline:none}
.hs-stage [hidden]{display:none}
.hs-live{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* herdr's status colours (Catppuccin), as in Figs 1-6: Mocha on dark, Latte inks on light */
.iso{
  --hs-red:#f38ba8;--hs-green:#a6e3a1;--hs-yellow:#f9e2af;--hs-muted:#a6adc8;--hs-blue:#89b4fa;--hs-mauve:#cba6f7;
  --hs-card:#191919;--hs-well:#0c0c0c;--hs-ink:#e9e9e6;--hs-dim:#a8a8a3;
  --hs-glass:#090909;--hs-field:#151515;--hs-lamp:#f2f2ee;--hs-bore:#030303;
  --hs-ground:#0e0f0e;--hs-band:#1c1d22;--hs-sel:#89b4fa2e;--hs-addw:#a6e3a124;--hs-delw:#f38ba826;--hs-addw2:#a6e3a166;--hs-delw2:#f38ba870;
  --hs-beam:#fff1c2;--hs-sec:#cfcfca;--hs-zebra:#ffffff0b;--hs-pane:#cfe3ff;--hs-chart:#1a1c1f;--hs-slat:#202020;
  --hs-ui:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
}
.iso[data-theme="light"]{
  --hs-red:#c70030;--hs-green:#0d7900;--hs-yellow:#9f5300;--hs-muted:#5c5f77;--hs-blue:#1e66f5;--hs-mauve:#8839ef;
  --hs-card:#fdfdfb;--hs-well:#d6d6d3;--hs-ink:#1d1d20;--hs-dim:#4f4f4a;
  --hs-glass:#cfcfcc;--hs-field:#ececE9;--hs-lamp:#1b1b1e;--hs-bore:#5e5e5b;
  --hs-ground:#f1f1ec;--hs-band:#e2e4ea;--hs-sel:#1e66f526;--hs-addw:#0d790022;--hs-delw:#c7003020;--hs-addw2:#0d79005c;--hs-delw2:#c7003055;
  --hs-beam:#ffd75e;--hs-sec:#3a3a37;--hs-zebra:#0000000c;--hs-pane:#7aa2d8;--hs-chart:#f6f7f8;--hs-slat:#e4e4e0;
}

.hs-well{fill:var(--hs-well)}
.hs-card-well{fill:var(--hs-card)}
.hs-ft{font-family:var(--anatomy-mono);font-weight:600;fill:var(--hs-ink);letter-spacing:.01em}
.hs-ui{font-family:var(--hs-ui);font-weight:500;fill:var(--hs-ink)}
.hs-plate-name{font-weight:500}

.hs-lamp-glow{fill:var(--hs-lamp);opacity:var(--hs-ssh,.85);pointer-events:none}
.hs-lamp-core{fill:#fff;opacity:var(--hs-ssh,.85);pointer-events:none}

/* moving flat parts: a face and its edge */
.hs-plate-side{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-plate-face{fill:var(--anatomy-shade-0);stroke:var(--anatomy-hi);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-pin{fill:var(--anatomy-hi)}

/* the beam: git's text, a bar of light with no outline; yellow mixed into the page so nothing shows through it */
.hs-beam{opacity:calc(.35 + .65 * var(--hs-b, 1))}
.hs-beam-under{fill:color-mix(in srgb,var(--hs-yellow) 55%,var(--anatomy-page))}
.hs-beam-top{fill:color-mix(in srgb,var(--hs-yellow) 70%,var(--anatomy-page))}
.hs-beam-face{fill:color-mix(in srgb,var(--hs-yellow) 55%,var(--anatomy-page))}
.hs-beam-core{fill:none;stroke:var(--anatomy-lit);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linecap:butt}
.hs-dash{fill:var(--anatomy-lit)}

/* the Host's bay: the lamp behind HEAD's chart, the chart's glass, the part, the guard */
.hs-lamp-lens{fill:var(--hs-beam);opacity:calc(.35 + .65 * var(--hs-x, 0))}
.hs-chart{fill:var(--hs-chart);fill-opacity:.82}
.hs-glasssolid .iso-fill,.hs-glasssolid .iso-shade,.hs-glasssolid .iso-top{fill-opacity:.6}
.hs-chart-grid{fill:none;stroke:var(--anatomy-lo);stroke-width:.35px;vector-effect:non-scaling-stroke}
.hs-headline{fill:none;stroke:var(--hs-ink);stroke-width:.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hs-notch{fill:var(--hs-red);fill-opacity:.35}
.hs-bulge{fill:var(--hs-green);fill-opacity:.55}
.hs-pane{fill:var(--hs-pane);fill-opacity:.06;stroke:none}
.hs-slotfill{fill:var(--hs-well)}
.hs-cone{fill:var(--anatomy-lit);opacity:.08}
.hs-glint{fill:none;stroke:var(--anatomy-lit);stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.35}
.hs-wire-loop{fill:none;stroke:var(--anatomy-hi);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linecap:round}
.hs-objlens{fill:var(--hs-beam);opacity:calc(.25 + .75 * var(--hs-x, 0))}

/* the Agents' lamps: Fig 1's glyphs, Working a yellow ring, Idle a small dot */
.hs-lamp-glass{fill:var(--hs-well)}
.hs-lamp-glass[data-s="working"]{fill:var(--hs-field)}
.hs-g-ring{fill:none;stroke:var(--hs-c);stroke-linecap:round}
.hs-g-dot{fill:var(--hs-c)}
.hs-g[data-s="idle"],.hs-dot[data-s="idle"]{--hs-c:var(--hs-muted)}
.hs-g[data-s="working"],.hs-dot[data-s="working"]{--hs-c:var(--hs-yellow)}
.hs-dot{fill:var(--hs-c);transition:fill .3s var(--anatomy-ease)}
.hs-swap{transition:opacity .3s var(--anatomy-ease)}
.hs-swap[data-off]{opacity:0}
[data-off]:not(.hs-swap){opacity:0}

/* the ground glass and the image on it */
.hs-ground{fill:var(--hs-ground)}
.hs-sc-title{font-weight:650}
.hs-sc-name{font-weight:700}
.hs-page{fill:var(--hs-ground)}
.hs-zebra{fill:var(--hs-zebra)}
.hs-push-shadow{fill:#000;opacity:.3}
.hs-sc-edge{fill:none;stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-sc-sec{fill:var(--hs-sec);font-weight:500}
.hs-sc-group{fill:var(--hs-sec);font-weight:650;letter-spacing:.03em}
.hs-sc-file{font-weight:500}
.hs-sc-count{font-weight:600}
.hs-sc-chev{stroke:var(--hs-blue)}
.hs-sc-rule{fill:none;stroke:var(--anatomy-lo);stroke-width:.35px;vector-effect:non-scaling-stroke}
.hs-sc-glyph{fill:none;stroke:var(--hs-sec);stroke-width:.55px;vector-effect:non-scaling-stroke;stroke-linecap:round}
.hs-add-ink{fill:var(--hs-green)}
.hs-del-ink{fill:var(--hs-red)}
.hs-letter{font-weight:800}
.hs-k-m{fill:var(--hs-yellow)}
.hs-k-a,.hs-k-u{fill:var(--hs-green)}
.hs-k-r{fill:var(--hs-blue)}
.hs-k-d{fill:var(--hs-red)}
.hs-k-c{fill:var(--hs-mauve)}
.hs-sel{fill:var(--hs-sel)}
.hs-sel[data-off]{opacity:0}
.hs-band-ft{font-weight:500}
.hs-wash[data-k="add"]{fill:var(--hs-addw)}
.hs-wash[data-k="del"]{fill:var(--hs-delw)}
.hs-wash[data-k="band"]{fill:var(--hs-band)}
.hs-wash[data-k="ctx"],.hs-wash[data-k="none"]{fill:none}
.hs-band-ft{fill:var(--hs-sec)}
.hs-word[data-k="add"]{fill:var(--hs-addw2)}
.hs-word[data-k="del"]{fill:var(--hs-delw2)}
.hs-gutter{fill:var(--hs-sec);font-weight:500}
.hs-sign{font-weight:600}
.hs-code{font-weight:500}
.hs-lsel{fill:none;stroke:var(--hs-blue);stroke-width:.7px;vector-effect:non-scaling-stroke}
.hs-menu{fill:var(--hs-card);stroke:var(--anatomy-mid);stroke-width:.45px;vector-effect:non-scaling-stroke}
.hs-menu-pick{fill:var(--hs-sel)}
.hs-menu-ft{font-weight:500}
.hs-spin{stroke:var(--hs-sec);stroke-width:.6px;stroke-linecap:round;vector-effect:non-scaling-stroke}
[data-image]{opacity:var(--hs-img,1)}
.hs-slat{fill:var(--hs-slat);stroke:var(--anatomy-lo);stroke-width:.35px;vector-effect:non-scaling-stroke}

/* the phone: claude's Agent detail */
.hs-glass{fill:var(--hs-glass)}
.hs-term{fill:var(--hs-well);stroke:var(--anatomy-lo);stroke-width:.35px;vector-effect:non-scaling-stroke}
.hs-term-ft{font-weight:600}
.hs-ph{letter-spacing:-.01em}
.hs-backglass{fill:var(--hs-card);fill-opacity:.82;stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-chbtn[data-press],[data-changes-btn][data-press] .hs-chbtn{fill:var(--hs-blue)}
.hs-status{font-weight:600}
.hs-tide{font-weight:500}
.hs-chip{fill:var(--hs-card);stroke:var(--anatomy-mid);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-chip-ft{font-weight:600}
.hs-home{fill:none;stroke:var(--hs-ink);stroke-width:1.1px;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.7}
.hs-card-platter{fill:var(--hs-field);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-draft{font-weight:600}
.hs-placeholder{fill:var(--hs-sec);font-weight:500}
.hs-caret{fill:var(--hs-blue)}
.hs-cursor{fill:var(--hs-ink)}
.hs-btn{fill:var(--hs-card);stroke:var(--anatomy-mid);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-glyph{fill:none;stroke:var(--hs-ink);stroke-width:.7px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hs-glyph-dot{fill:var(--hs-ink)}
.hs-send-disc{fill:var(--anatomy-lit)}
.hs-send-arrow{fill:none;stroke:var(--anatomy-paper);stroke-width:.8px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.hs-send[data-off]{opacity:1}
.hs-send[data-off] .hs-send-disc{fill:var(--hs-card);stroke:var(--anatomy-lo);stroke-width:.4px;vector-effect:non-scaling-stroke}
.hs-send[data-off] .hs-send-arrow{stroke:var(--hs-dim)}
.hs-chevron{fill:none;stroke:var(--hs-ink);stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}

/* the tag: a punched card in the slug's type, the one lit part that leaves the screen */
.hs-tag-face{fill:var(--anatomy-lit)}
.hs-tag-ft{fill:var(--anatomy-paper);font-weight:700;letter-spacing:-.01em}
.hs-hole{fill:var(--hs-bore);stroke:var(--anatomy-paper);stroke-width:.3px;vector-effect:non-scaling-stroke}
.hs-hole-mark{fill:none;stroke:var(--anatomy-paper);stroke-width:.35px;vector-effect:non-scaling-stroke}

/* the SSH line: a chunk carrying a request is drawn lit */
.hs-wire .tb-body,.hs-wire .tb-shine,.hs-wire .tb-shade{transition:fill .4s var(--anatomy-ease)}
.hs-wire[data-hot] .tb-body,.hs-wire[data-hot] .tb-shine,.hs-wire[data-hot] .tb-shade{fill:var(--anatomy-lit);transition:fill .05s linear}

.hs-focus{fill:none;stroke:var(--anatomy-lit);stroke-width:1.2px;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;pointer-events:none}
.hs-stage[data-crop] svg{width:100%;height:auto;overflow:hidden}
.hs-stage[data-crop] .iso-halo{display:none}

/* legend swatches: the figure's own marks, small */
.hs-sw{height:14px;flex:none;overflow:visible}
.hs-sw path,.hs-sw rect,.hs-sw circle{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.hs-sw .f-lit{fill:var(--anatomy-lit);stroke:none}

iewBox="0 0 22 14" style="width:22px" aria-hidden="true"><rect class="f-lit" x="1" y="2" width="20" height="10" rx="1"/><circle class="f-paper-dot" cx="5" cy="5" r="1"/><circle class="f-paper-dot" cx="10" cy="5" r="1"/></svg>a path:line for your draft; Send stays yours</span><span class="iso-key"><svg class="hs-sw" viewBox="0 0 14 14" style="width:14px" aria-hidden="true"><path class="f-ring" d="M7 2.6A4.4 4.4 0 1 1 2.6 7"/></svg>Working → Idle: one read, 300 ms later</span></span><span class="iso-caption">Changes shows the Checkout an Agent is in, its uncommitted files against HEAD as git on the Host reads them, the same for every Agent in that Checkout. Each read is one SSH exec, run on open, on pull to refresh, or 300 ms after the Agent it was opened from leaves Working, and a file's diff is read only when you tap it. Nothing in Changes stages, commits or discards; Insert Line Reference only puts a path and line into your draft.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)

    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();

function fitText(el, full, width, keep = "tail") {

    return full.slice(0, a) + "…" + full.slice(full.length - (n - a));

  let lo = 0;
  let hi = full.length;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    el.textContent = cut(mid);
    if (el.getComputedTextLength() <= width) lo = mid;
    else hi = mid - 1;

  el.textContent = cut(lo);

}
const acting = () => events.some((e) => e.tag === "act");

// ---------------------------------------------------------------- words
const say = (text) => readout.textContent !== text && (readout.textContent = text);
const announce = (text) => (announcer.textContent = text);
const tell = (text, spoken = text) => {

// ---------------------------------------------------------------- the discrete state
// open: Changes on screen; view: "diff" (a file's diff pushed over the list) or "list"; file: the diff page's file;
// sel: the tapped row; fresh: the time the Possibly incomplete label shows, or null; draft: claude's Composer draft
const S = {};
function lamp(who) {

  const L = P.lamps[who];
  L.glass.setAttribute("data-s", s);
  off(L.idle, s !== "idle");
  off(L.working, s !== "working");
  if (who === "claude") {
    P.agentDot.setAttribute("data-s", s);
    P.chipDot.setAttribute("data-s", s);
    P.agentWord.textContent = s === "working" ? "Working" : "Idle";
    P.trows[0].textContent = s === "working" ? "✻ Working…" : "⏺ Ready when you are.";
    off(P.cursor, s === "working");

}
// the phone: Changes over claude's detail while open; claude's detail, with its draft, once closed
function phoneDraw() {
  off(P.agent, S.open);
  off(P.phPages, !S.open);
  const lines = wrapDraft(S.draft);
  P.draft.forEach((el, i) => (el.textContent = lines[i] ?? ""));
  off(P.placeholder, !!S.draft);
  off(P.caret, !S.draft);
  if (S.draft) {
    const last = lines.length - 1;
    P.caret.setAttribute("x", f2(D.phone.text + P.draft[last].getComputedTextLength() + 0.3));
    P.caret.setAttribute("y", f2(-D.phone.draft[last] - 4.3));
  }

}
// the Composer's text view wraps a long path where it can, after a slash
function wrapDraft(text) {
  if (!text) return [];
  const el = P.draft[2];
  const width = D.phone.width;
  const out = [];
  let rest = text;
  while (rest) {
    el.textContent = rest;
    if (el.getComputedTextLength() <= width || out.length === 2) {
      out.push(rest);
      break;
    }
    let cut = rest.length;
    for (let n = rest.length - 1; n > 0; n--) {
      el.textContent = rest.slice(0, n);
      if (el.getComputedTextLength() <= width) {
        cut = n;
        break;
      }
    }
    const slash = rest.lastIndexOf("/", cut - 1);
    if (slash > 0) cut = slash + 1;
    out.push(rest.slice(0, cut));
    rest = rest.slice(cut);
  }
  el.textContent = "";
  return out;
}
function viewDraw() {
  for (const sc of SCOPES) {
    sc.root.setAttribute("data-view", S.view);
    off(sc.diff, S.view !== "diff");
  }
}

// ---------------------------------------------------------------- the resting frame
function rest() {
  for (const key of Object.keys(tw)) delete tw[key];
  events = events.filter((e) => e.tag === "tour");
  restoreAll();
  Object.assign(S, { file: REST_FILE, sel: REST_FILE, view: "diff", open: true, claude: "idle", codex: "idle", fresh: null, readAt: READ_BEFORE, draft: "", reading: false, loading: false, tag: false });
  set("crank", 0);
  set("lever", 0);
  set("ram", 0);
  set("tagX", D.tag.from);
  set("shut", 0);
  set("img", 1);
  set("x", 0);
  set("push", 1);
  set("hose", -1);
  set("dash", -1);
  set("beam", 1);
  set("fade", 1);

// ---------------------------------------------------------------- a read: one exec over SSH, git's text comes back
// the request runs out along the SSH line; on macbook git runs (the lamp exposes the part against HEAD); lit dashes of
// text run down the beam into the screen, which re-exposes; the pages stay on screen meanwhile (ChangesView.swift:43-50)
function pulse(dur, delay = 0) {
  at(delay, () => {
    set("hose", 0);
    to("hose", 1.25, dur, linear);
  });
  at(delay + dur, () => set("hose", -1));
}
function exposeAndReturn(t, { onImage, diff = false } = {}) {
  at(t, () => {
    to("x", 1, 0.25, easeOut);
    tell(diff ? SAY.diff : SAY.git);
  });
  at(t + 0.55, () => to("x", 0, 0.9));
  // git's text: four dashes along the beam, Host to screen, in 0.6 s
  at(t + 0.4, () => {
    set("dash", 0);
    to("dash", 1, 0.9, linear);
  });
  at(t + 1.3, () => set("dash", -1));
  at(t + 1.25, () => {
    to("img", 0.45, 0.14, easeOut);
    if (onImage) onImage();
  });
  at(t + 1.45, () => to("img", 1, 0.5));
  return t + 1.95;
}
function spinning(on) {
  S.reading = on;
  for (const sc of SCOPES) off(sc.spin, !on);
}
function read({ crank = false, auto = false } = {}) {

    to("crank", 360, 1.1, easeInOut);
    tell(SAY.crank, "Pull to refresh: one SSH exec to macbook");
  }
  // one git exec per Host at a time; this one starts at once
  pulse(0.9, crank ? 0.25 : 0);
  const t = crank ? 1.15 : 0.9;
  const working = S.claude === "working";
  const end = exposeAndReturn(t, {
    onImage: () => {
      // a read that overlapped Working keeps the label, with its own time; one that did not clears it
      // (ChangesStore+AutoRefresh.swift:110-115; ChangesStore.swift:85-90)
      if (working) S.readAt = READ_AT;
      S.fresh = working ? S.readAt : null;
      freshDraw();
      spinning(false);
    },
  });
  at(t + 0.95, () => tell(SAY.back, "Only git's text output comes back, within 10 seconds"));
  at(end, () => tell(working ? SAY.incomplete : auto ? SAY.auto : SAY.read));
  return end;
}

// ---------------------------------------------------------------- claude works, then stops: a read 300 ms later
function workThenIdle(withCrank = true) {
  if (acting() || !S.open) return;
  S.claude = "working";
  lamp("claude");
  // the label shows at once, with the last read's time (ChangesStore.swift:85-90)
  S.fresh = S.readAt;
  freshDraw();
  tell(SAY.working);
  let t = 2.0;
  if (withCrank) {
    at(t, () => read({ crank: true }));
    t += 4.4;
  }
  at(t, () => {
    S.claude = "idle";
    lamp("claude");
    tell(SAY.idle, "claude leaves Working; Changes reads again 300 milliseconds later");
  });
  // the debounce: 300 ms after the status change, one read (ChangesStore+AutoRefresh.swift:120-135)
  at(t + 0.3, () => read({ auto: true }));

// ---------------------------------------------------------------- tap a file: its diff is pushed and read now, only now
// one more exec, `git diff HEAD -U3 -- <path>` (GitProbe+Patch.swift:12-32)
function doTap(name) {
  S.sel = name;
  S.file = name;

  S.loading = true;

    off(sc.lsel, true);
    diffDraw(sc, name);
  }
  selDraw();
  viewDraw();
  readingDraw();
  set("push", 0);
  to("push", 1, 0.42, easeOut);

  const end = exposeAndReturn(1.1, {

// ---------------------------------------------------------------- Insert Line Reference: a card into claude's draft
// on the open diff's line: its menu, Insert Line Reference; Changes closes and the path:line goes in at the draft's
// caret (ChangesStore+References.swift:13-30; AgentChangesPresentation.swift:109-113)

  if (acting() || !S.open) return;
  if (S.view !== "diff" || S.loading) {
    tell(SAY.noDiff);
    return;
  }
  const file = S.file;
  const h = HUNKS[file];
  for (const sc of SCOPES) {
    const i = slotOfLine(sc, h.refLine);
    if (i < 0) continue;
    const z = sc.L.slots[i];
    sc.lsel.setAttribute("y", f2(-z));
    off(sc.lsel, false);
    if (sc.menu) {

      off(sc.menu, false);
    }
  }
  P.tagRows.forEach((el, i) => (el.textContent = h.tag[i]));
  tell(SAY.punch, "Insert Line Reference: it closes Changes and goes into claude's draft");
  at(1.0, () => {
    for (const sc of SCOPES) off(sc.menu, true);
    to("lever", 1, 0.25, easeIn);
    to("ram", 1, 0.25, easeIn);
  });
  at(1.3, () => {
    to("lever", 0, 0.6);
    to("ram", 0, 0.6);

    moveBefore(P.tag, "punch.body");
    off(P.tag, false);
    set("tagX", D.tag.from);
    to("tagX", 0, 1.3, easeOut);

    S.tag = true;
    S.draft = refOf(file);

// Changes again, from the floating glass button: closing discarded the store, so this is a fresh read and the list
// (AgentChangesPresentation.swift:4-7)
function reopen() {
  if (acting() || S.open) return;
  P.changesBtn.toggleAttribute("data-press", true);
  at(0.3, () => P.changesBtn.toggleAttribute("data-press", false), "fx");
  Object.assign(S, { open: true, view: "list", sel: null, fresh: null, loading: false });
  viewDraw();
  selDraw();
  freshDraw();
  phoneDraw();
  to("shut", 0, 0.8);
  to("beam", 1, 0.8);
  tell(SAY.reopen);

// ---------------------------------------------------------------- codex: another Agent in the same Checkout
function codexBeat() {
  if (acting()) return;
  to("codexHi", 1, 0.3);
  tell(SAY.shared, "codex works in storefront too; it would see the same Changes");
  at(2.6, () => to("codexHi", 0, 0.6));
  at(3.2, () => {});

// a cut back to the resting frame
function crossfade(apply, tag = "act") {
  to("fade", 0, 0.32);
  at(0.34, () => {
    apply();
    set("fade", 0);
    to("fade", 1, 0.36);

// ---------------------------------------------------------------- drawing
const plateEls = Object.fromEntries(Object.keys(D.plates).map((name) => [name, $$(`[data-p="${name}"]`)]));
function plate(name, deg) {
  const p = D.plates[name];
  const turn = rotAbout(p.pin, deg);
  const els = plateEls[name];
  p.parts.forEach((part, i) => {
    const pts = part.map(turn);
    const sil = convexHull([...pts.map(([x, z]) => abs([x, p.y0, z])), ...pts.map(([x, z]) => abs([x, p.y1, z]))]);
    els[i].setAttribute("d", polyOf(sil));
  });
  (p.faces ?? [p.parts[0]]).forEach((face, i) => els[p.parts.length + i].setAttribute("d", onFace(face.map(turn), p.y1)));
}
function draw() {
  // the crank turns about its boss; the grip rides its end

  plate("crank", c);
  const [px, pz] = D.crank.pin;
  const g = rotAbout(D.crank.pin, c)([0, D.crank.r]);
  P.grip.setAttribute("transform", translate([g[0] - px, 0, g[1] - (pz + D.crank.r)]));
  // the punch: the lever turns down, the knob with it, the ram goes down
  const lv = val("lever") * D.lever.press;
  plate("lever", lv);
  const kn = rotAbout([0, 0], lv)(D.lever.knob);
  P.knob.setAttribute("transform", translate([kn[0] - D.lever.knob[0], 0, kn[1] - D.lever.knob[1]]));
  P.ram.setAttribute("transform", translate([0, 0, -val("ram") * D.ram.travel]));
  P.tag.setAttribute("transform", translate([val("tagX"), 0, 0]));
  // the screen: the shutter, the image's exposure, the diff page's push, the toolbar spinner
  P.shutter.setAttribute("transform", `translate(0 ${f2(-(1 - val("shut")) * D.shutter.travel)})`);
  P.image.style.setProperty("--hs-img", f2(val("img")));
  const push = val("push");
  for (const sc of SCOPES) {
    sc.diff.setAttribute("transform", `translate(${f2((1 - push) * (sc.L.x1 - sc.L.diff.x0 + 3))} 0)`);
    if (S.reading) sc.spinBars.forEach((el, i) => (el.style.opacity = f2(0.25 + (0.75 * ((((i - clock * 10) % 8) + 8) % 8)) / 8)));
  }
  // the lamp behind HEAD and the objective's lens brighten while git reads
  const x = val("x");
  P.exposure.style.setProperty("--hs-x", f2(x));
  P.objlens.style.setProperty("--hs-x", f2(x));
  P.beam.style.setProperty("--hs-b", f2(val("beam")));
  // git's text: each dash runs the beam's length in 0.6 s, a tenth of a second after the one before
  const d = val("dash");
  const run = D.beam.x0 - D.beam.x1 - D.beam.dash;
  P.dashes.forEach((el, i) => {
    const p = d < 0 ? -1 : (d * 0.9 - i * 0.1) / 0.6;
    off(el, p <= 0 || p >= 1);
    if (p > 0 && p < 1) el.setAttribute("transform", translate([-p * run, 0, 0]));
  });

  const h = val("hose");
  P.hose.forEach((els, i) => {
    const hot = h >= 0 && Math.abs(i / Math.max(1, D.hose - 1) - (h - 0.12)) < 0.12;
    for (const el of els) el.toggleAttribute("data-hot", hot);
  });
  P.lamps.codex.glass.style.setProperty("--hs-hi", f2(val("codexHi")));
  boardG.style.opacity = f2(val("fade"));
}

// ---------------------------------------------------------------- the idle tour
// a read by the crank; claude works (the label at once), a read during Working, then Idle and a read 300 ms later
// (the label goes); Insert Line Reference; Changes again 3 s after the card lands (the list); a tap on CartStore;
// codex; back to rest
const TOUR = [
  [0.8, () => read({ crank: true })],
  [9.4, () => workThenIdle(true)],
  [21.0, () => insertRef()],
  [26.6, () => reopen()],
  [31.4, () => tapFile(TAP_FILE)],
  [36.8, () => codexBeat()],
  [41.0, () => crossfade(() => { rest(); tell(SAY.rest); }, "tour")],
  [44.0, null],
];
let touring = !still.matches;
// the tour comes back 9 s (on the figure's clock) after the last input or the last action's end
let lastInput = 0;
const IDLE = 9;
function startTour() {
  events = events.filter((e) => e.tag !== "tour");
  for (const [t, fn] of TOUR) if (fn) at(t, fn, "tour");
  at(TOUR[TOUR.length - 1][0], () => touring && startTour(), "tour");
}
let goRank = -1;
let goGen = 0;
let driven = false;
const tourResume = resume;
resume = () => (driven ? (lastInput = clock) : tourResume());
window.heelerFigure = {
  go(target) {
    const rank = { read: 0, tap: 1, ref: 2 };
    if (!(target in rank)) return;
    driven = true;
    touring = false;
    events = events.filter((e) => e.tag !== "tour" && e.tag !== "step");
    const want = rank[target];
    if (want === goRank) return kick();
    const gen = ++goGen;
    const beats = [];
    const pump = (pause = 0) => {
      if (gen !== goGen || !beats.length) return;
      if (acting()) return at(0.25, () => pump(0.8), "step");
      if (pause) return at(pause, () => pump(0), "step");
      beats.shift()();
      at(0.25, () => pump(0.8), "step");
    };
    let from = goRank;
    if (from < 0 || from > want) {
      rest();
      tell(SAY.rest);
      from = -1;
    }
    if (from < 0) beats.push(() => read({ crank: true }));
    if (want >= 1 && from < 1) beats.push(() => doTap(TAP_FILE));
    if (want >= 2 && from < 2) beats.push(() => insertRef());
    goRank = want;
    pump(from < 0 ? 0.6 : 0.2);
    if (still.matches) settleNow();
    else kick();
  },
};
function steer() {
  if (touring) {
    touring = false;
    events = events.filter((e) => e.tag !== "tour");
  }
  lastInput = clock;
  kick();
}
function resume() {
  touring = true;
  crossfade(() => { rest(); tell(SAY.rest); }, "tour");
  at(0.8, startTour, "tour");
}

// ---------------------------------------------------------------- pointer and keys
const inv = (m, x, y) => {
  const [a, b, c, d, e, f] = m;

  return [(d * (x - e) - c * (y - f)) / det, (-b * (x - e) + a * (y - f)) / det];

function faceAt(event, matrix) {

  pt.x = event.clientX;
  pt.y = event.clientY;

  const [u, v] = inv(matrix, p.x, p.y);
  return { u, z: -v };

    if ((region.startsWith("row:") || region === "hunk") && !S.open) continue;
    if (region === "hunk" && S.view !== "diff") continue;
    const f = faceAt(event, D.planes[y]);
    if (f.u >= x0 && f.u <= x1 && f.z >= z0 && f.z <= z1) return region;
  }

}
function linesOf(region) {

    return [`${row.name} · tap for its diff`, ...PARTS.row];
  }
  if (region === "screen" && !S.open) return ["Changes closed · the reference is in the draft", "Open it again: the glass button on the phone"];
  if (region === "screen" && S.view === "list") return ["Changes · storefront's uncommitted files", "Tap a file to push its diff over the list"];
  if (region === "hunk" && S.file !== REST_FILE) return [`${HUNKS[S.file].range} · ${S.file}`.slice(0, 46), "Its only hunk · old and new line numbers", PARTS.hunk[1]];
  if (region === "tray" && S.tag) return [`${S.draft.trim()}`.slice(-46), ...PARTS.tray];

}
let stepTimer = 0;

const REGIONS = D.rings.map(([region]) => region);
let focusIndex = 0;
const focusRing = (() => {

})();

  pressed = false;
  showFocus(REGIONS[focusIndex]);
  announce(readout.textContent);
});
stage.addEventListener("blur", () => {
  pressed = false;
  keyboardFocus(false);
  focusRing.toggleAttribute("hidden", true);
});

// ---------------------------------------------------------------- the loop
function step(dt) {
  clock += dt;
  runEvents();
  if (!touring && !still.matches) {
    if (acting()) lastInput = clock;
    else if (clock - lastInput > IDLE) resume();
  }
  return acting() || Object.keys(tw).length > 0 || events.length > 0 || (!touring && !still.matches);
}
// reduced motion: an action jumps to its end; nothing moves on its own
function settleNow() {
  for (let i = 0; i < 4000 && (events.some((e) => e.tag !== "tour") || Object.keys(tw).length); i++) {
    clock += 0.05;
    runEvents();
    for (const key of Object.keys(tw)) val(key);
  }
  draw();
}
let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const busy = step(dt) || touring;
  draw();
  frame = visible && busy ? requestAnimationFrame(tick) : 0;
}
function kick() {
  if (!frame && visible && !still.matches) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) kick();
}, { rootMargin: "120px 0px" }).observe(stage);
// narrow cards show the story region (the screen, the tray and punch, the beam and the part) larger
const fullBox = svg.getAttribute("viewBox");
new ResizeObserver(() => {
  const narrow = stage.clientWidth < 520;
  svg.setAttribute("viewBox", narrow ? D.crop.join(" ") : fullBox);
  stage.toggleAttribute("data-crop", narrow);
}).observe(stage);
// the resting frame: Changes open on storefront, PaymentCoordinator's diff pushed over the list, claude Idle
measureMono();
layoutList();
rest();
draw();
document.fonts?.ready.then(() => {
  measureMono();
  layoutList();
  for (const sc of SCOPES) diffDraw(sc, S.file);
  phoneDraw();
});
if (touring) startTour();
</script></body></html>
