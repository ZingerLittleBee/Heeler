name: Heeler
options:
  bundleIdPrefix: dev.bybee
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    # Swift 6 language mode implies complete strict concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Let the compiler hand SwiftUI `Text("…")` literals and friends to the
    # String Catalog at build time, so `Localizable.xcstrings` keeps its key
    # list current as code changes (String Catalog auto-extraction).
    SWIFT_EMIT_LOC_STRINGS: "YES"
    DEVELOPMENT_TEAM: 9VM4RM39R3
    CODE_SIGN_STYLE: Automatic

packages:
  # Repository-local package owning the libssh2/OpenSSL implementation and
  # checked-in native artifacts. The one SSH backend (ADR 0011).
  HeelerSSH:
    path: Packages/HeelerSSH
  # Repository-local package running Tailscale, ZeroTier, and EasyTier nodes
  # in-process. It only dials byte streams for HeelerSSH; it never replaces
  # the SSH backend (ADR 0021). Its native libraries come from an exact
  # release of heeler-overlay-natives, pinned in its own Package.swift.
  HeelerOverlay:
    path: Packages/HeelerOverlay
  # Pin the reviewed 2.2.2026103001 source commit. Its prebuilt libghostty is
  # Ghostty 1e9e14af5df1, asset revision 3, with SwiftPM checksum
  # 0bf7e5e13f8e42ffca040a6cef7e985fc30bcaa81ff513bd2a93eb097398c6d8.
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm.git
    revision: "3404c8a2e6403d0a5e730eb08abdaa1c865a83e9"

targets:
  Heeler:
    type: application
    platform: iOS
    sources:
      - path: Sources/Heeler
        excludes:
          # Bundled as a folder reference below so notice files stay under
          # Notices/ in the app bundle rather than flattening to the root.
          - Resources/Notices
      # Notification code shared with the service extension: envelope
      # decryption, Notification Key store, alert renderer (ADR 0008).
      - Sources/HeelerNotificationCore
      # Live Activity attributes + details envelope (shared with HeelerWidgets).
      - Sources/HeelerActivityCore
      # Usage formats and the widgets' snapshot (shared with HeelerWidgets).
      - Sources/HeelerUsageCore
      # Widget views double-included so Xcode can host their #Preview gallery
      # in the app target (plain previews are unsupported inside app-extension
      # targets), and app tests can render the Usage widgets; the @main
      # WidgetBundle, intents and timelines stay extension-only.
      - Sources/HeelerWidgets/AgentLiveActivityWidget.swift
      - Sources/HeelerWidgets/AgentActivityDecryptor.swift
      - Sources/HeelerWidgets/Usage/UsageWidgetViews.swift
      # Audited third-party notices + inventory.json (#161). Folder reference
      # preserves the Notices/ subdirectory the catalogue resolves against.
      - path: Sources/Heeler/Resources/Notices
        type: folder
        buildPhase: resources
      # The Host Helper the app installs on a herdr-core Host (ADR 0033). A
      # folder reference keeps its tree whole; its manifest names every file.
      - path: plugin/helper
        type: folder
        buildPhase: resources
      # Heeler's Claude Code hook script, placed on a tmux Host apart from the
      # Helper (ADR 0044).
      - path: plugin/claude-code
        type: folder
        buildPhase: resources
    info:
      path: Sources/Heeler/Info.plist
      properties:
        # XcodeGen would otherwise hardcode 1.0/1 here, and a file value wins
        # over the generated one; keep both versions on the build settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The commit a distributed build was made from, shown in About ›
        # Acknowledgements (BuildSourceRevision). `make archive` and
        # release.yml set it; other builds leave it empty.
        HeelerSourceRevision: $(HEELER_SOURCE_REVISION)
        # Without this an iPhone holds app-driven animation to 60Hz, while the
        # system keyboard next to it runs at 120Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # A dragged Console row carries this activity; iPadOS creates a new
        # window from it only for a declared type. The generated scene
        # manifest already declares multiple-scene support.
        NSUserActivityTypes:
          - dev.bybee.heeler.agent
        # Find on Local Network (LocalNetworkDiscovery) browses this type.
        NSBonjourServices:
          - _ssh._tcp
        # The Usage widgets' app refresh task (AgentUsageBackgroundRefresh).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - dev.bybee.heeler.usage-refresh
        # `heeler://agent` links (AgentActivityLink). A Live Activity tap
        # opens its own app without this; other apps' links need it.
        CFBundleURLTypes:
          - CFBundleURLName: dev.bybee.heeler
            CFBundleURLSchemes:
              - heeler
    entitlements:
      path: Sources/Heeler/Heeler.entitlements
      properties:
        # Development here covers Debug/local device builds (sandbox APNs);
        # App Store / TestFlight re-signing flips it to production, so the
        # APNs environment follows the build configuration (#71).
        aps-environment: development
        # Shared with the Notification Service Extension; doubles as the
        # Keychain access group holding the Notification Keys.
        com.apple.security.application-groups:
          - group.dev.bybee.heeler.shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.heeler
        # Home-screen name; the App Store listing is "Heeler for herdr".
        INFOPLIST_KEY_CFBundleDisplayName: Heeler
        MARKETING_VERSION: "0.1.18"
        CURRENT_PROJECT_VERSION: "43"
        # Scan to Pair (#62) reads the Pairing Code QR from the computer screen.
        INFOPLIST_KEY_NSCameraUsageDescription: "Heeler uses the camera to scan the Pairing Code shown on your computer, so you can add that machine without typing anything."
        # Voice Input (ADR 0036) records only after a tap on the Composer's
        # mic, and uploads to the speech service the user set up.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Heeler records your voice when you tap the microphone in the Composer, and sends the recording to the speech service you chose in Settings to turn it into text."
        # Only exempt encryption is used: standard, published algorithms in
        # SSH (the HeelerSSH package's libssh2/OpenSSL), OS-provided
        # CryptoKit, and the overlay networks' protocols (WireGuard in
        # Tailscale, ZeroTier's, and EasyTier's, ADR 0021). Declaring it here
        # keeps every TestFlight upload from stalling on the Missing
        # Compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # iPhone and iPad. App Store Connect derives device support from the build.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # ActivityKit starts Live Activities from the app; HeelerWidgets renders them.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # In-app overlay nodes (ADR 0021) find peers on the same LAN for direct
        # paths; iOS asks before the first local-network packet.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Heeler uses your local network to connect directly to Hosts on your Tailscale, ZeroTier, or EasyTier network when they are nearby, and to find machines that offer SSH."
        HEELER_SOURCE_REVISION: ""
        # Beside the vector icons and Agent marks, the catalogs hold the app
        # icon's pre-rendered 1024px images; space-optimized encoding stays
        # lossless and saves ~0.46 MB per device. Decoding is the system's,
        # at icon render time.
        ASSETCATALOG_COMPILER_OPTIMIZATION: space
      configs:
        Release:
          # Nothing loads symbols from the app executable, so its 1.52 MB
          # export trie, mostly CEasyTier's Rust symbols, is dead weight.
          # Release only; Debug's test host and debug dylib need it.
          LD_EXPORT_SYMBOLS: NO
    dependencies:
      - package: HeelerSSH
      - package: HeelerOverlay
      - package: GhosttyTerminal
      - package: GhosttyTerminal
        product: GhosttyTheme
      - target: HeelerNotificationService
      - target: HeelerWidgets

  # Decrypts Agent Notifications before display (ADR 0008, #71). A thin
  # shell: the logic lives in HeelerNotificationCore, tested from the app
  # suite. The extension cannot link the app, so the shared sources (and the
  # few app files they lean on) are compiled in directly.
  HeelerNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HeelerNotificationService
      - Sources/HeelerNotificationCore
      # The extension renders notification copy from HeelerNotificationCore,
      # and an extension only localizes against the resources inside its own
      # bundle.
      - Sources/Heeler/Resources/Localizable.xcstrings
      - Sources/Heeler/Support/Base64URL.swift
      - Sources/Heeler/Transport/SecretStore.swift
      # For AgentStatus; Foundation-only by construction (JSONValue is the
      # generated file's one in-repo dependency).
      - Sources/Heeler/Transport/Generated/HerdrAPITypes.swift
      - Sources/Heeler/Transport/JSONValue.swift
    entitlements:
      path: Sources/HeelerNotificationService/HeelerNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.bybee.heeler.shared
    info:
      path: Sources/HeelerNotificationService/Info.plist
      properties:
        # An app extension's versions must match its containing app's, or
        # App Store validation rejects the bundle. XcodeGen would otherwise
        # hardcode its own 1.0/1 defaults here; point at the build settings
        # so both bundles stay in lockstep.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store validation (code 90360) requires a display name on
        # every embedded appex; never user-visible for this extension.
        CFBundleDisplayName: Heeler Notification Service
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.heeler.NotificationService
        MARKETING_VERSION: "0.1.18"
        CURRENT_PROJECT_VERSION: "43"
        # Match the containing app's iPhone and iPad device family.
        TARGETED_DEVICE_FAMILY: "1,2"

  # Lock-screen / Dynamic Island Live Activity (docs/agents/live-activity-contract.md).
  # Thin WidgetKit shell: attributes, envelope open, and Notification Key
  # selection live in HeelerActivityCore / HeelerNotificationCore, compiled
  # in the same way as the notification service extension (the appex cannot
  # link the app). @main is the WidgetBundle; there is no principal class.
  HeelerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HeelerWidgets
      # The app's String Catalog, compiled into this extension's bundle too:
      # the widgets and the Live Activity render their text here, and an
      # extension only localizes against the resources inside its own bundle.
      - Sources/Heeler/Resources/Localizable.xcstrings
      - Sources/HeelerActivityCore
      - Sources/HeelerNotificationCore
      # Usage formats and the snapshot the app writes for the Usage widgets.
      - Sources/HeelerUsageCore
      - Sources/Heeler/Support/Base64URL.swift
      - Sources/Heeler/Transport/SecretStore.swift
      # For AgentStatus; Foundation-only by construction (JSONValue is the
      # generated file's one in-repo dependency). NotificationEnvelope in
      # HeelerNotificationCore needs it.
      - Sources/Heeler/Transport/Generated/HerdrAPITypes.swift
      - Sources/Heeler/Transport/JSONValue.swift
      # Shared with the app Console; single hex owner for status colors (#247).
      - Sources/Heeler/Console/AgentStatusPalette.swift
    entitlements:
      path: Sources/HeelerWidgets/HeelerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.bybee.heeler.shared
    info:
      path: Sources/HeelerWidgets/Info.plist
      properties:
        # An app extension's versions must match its containing app's, or
        # App Store validation rejects the bundle. XcodeGen would otherwise
        # hardcode its own 1.0/1 defaults here; point at the build settings
        # so both bundles stay in lockstep.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store validation (code 90360) requires a display name on
        # every embedded appex. Also the counts-only lock-screen fallback.
        CFBundleDisplayName: Heeler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.heeler.Widgets
        MARKETING_VERSION: "0.1.18"
        CURRENT_PROJECT_VERSION: "43"
        # Match the containing app's iPhone and iPad device family.
        TARGETED_DEVICE_FAMILY: "1,2"

  HeelerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HeelerTests
        excludes:
          # Bundled as a folder reference below so the captured transcripts
          # and screens keep their directory layout instead of flattening
          # (and colliding) at the bundle root.
          - ChatFixtures
      - path: Tests/HeelerTests/ChatFixtures
        type: folder
        buildPhase: resources
      # Shared Pairing Code vectors (ADR 0007): the same file the Node plugin
      # tests consume, bundled so the Swift tests cannot drift from it.
      - path: plugin/test-vectors/pairing-code-v1.json
        buildPhase: resources
      # Pairing Code v2 vectors (ADR 0021): Swift-only, the Node plugin emits v1.
      - path: plugin/test-vectors/pairing-code-v2.json
        buildPhase: resources
      # Shared notification envelope vectors (ADR 0008), same arrangement.
      - path: plugin/test-vectors/notification-payload-v1.json
        buildPhase: resources
      # Shared Live Activity details envelope vectors, same arrangement.
      - path: plugin/test-vectors/live-activity-content-v1.json
        buildPhase: resources
      # Shared sidebar layout snapshot vectors, consumed by Node and Swift.
      - path: plugin/test-vectors/sidebar-layout-v1.json
        buildPhase: resources
      # Shared notification session vectors (#412), consumed by Node and Swift.
      - path: plugin/test-vectors/notification-session-v1.json
        buildPhase: resources
      # Shared herdr-core frame vectors, read by Swift now and the Helper later.
      - path: plugin/test-vectors/herdr-core-frames-v1.json
        buildPhase: resources
      # Scrubbed native Windows capture, replayed by the Swift link tests.
      - path: plugin/test-vectors/herdr-core-frames-windows-v1.json
        buildPhase: resources
      - path: plugin/test-vectors/herdr-core-session-names-v1.json
        buildPhase: resources
      # Shared Agent rule vectors, read by Swift and the Helper.
      - path: plugin/test-vectors/herdr-core-agent-rule-v1.json
        buildPhase: resources
      # Shared turn-end vectors, read by Swift and the Helper.
      - path: plugin/test-vectors/herdr-core-turn-end-v1.json
        buildPhase: resources
      # Shared seen-mark vectors: Swift writes the format and the Helper reads it.
      - path: plugin/test-vectors/herdr-core-seen-mark-v1.json
        buildPhase: resources
      # Shared tmux Program Status vectors, read by Swift, the hook script and the Helper.
      - path: plugin/test-vectors/tmux-heeler-status-v1.json
        buildPhase: resources
      # The tmux input measurements: keys, text and pastes per version and mode.
      - path: plugin/test-vectors/tmux-input-v1.json
        buildPhase: resources
      # Heeler's Claude Code hook entries, read by Swift and the hook script's tests.
      - path: plugin/test-vectors/claude-code-hooks-v1.json
        buildPhase: resources
      # Shared usage response produced by Node and decoded by Swift.
      - path: plugin/test-vectors/usage-v1.json
        buildPhase: resources
      # Shared plugin version vector: the release the app recommends.
      - path: plugin/test-vectors/plugin-version-v1.json
        buildPhase: resources
      # Shared Host Helper version vector: the Helper the app bundles.
      - path: plugin/test-vectors/host-helper-version-v1.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.heeler.tests
    dependencies:
      - target: Heeler
      - package: HeelerSSH
      - package: HeelerOverlay
      - package: GhosttyTerminal

  # Operator-authorized tests against disposable live Agents. These are not
  # members of HeelerTests or its complete CI coverage contract.
  HeelerLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HeelerLiveTests
      - Tests/HeelerTests/Support/RealSSHFixture.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.heeler.live-tests
    dependencies:
      - target: Heeler
      - package: HeelerSSH

schemes:
  Heeler:
    build:
      targets:
        Heeler: all
    test:
      targets:
        - HeelerTests
      # The only variable the app test process needs from the invoking shell.
      # The fixture itself arrives through the Simulator's launchd environment
      # as HEELER_SSH_E2E_CONFIG / HEELER_SSH_JUMP_E2E_CONFIG /
      # HEELER_PAIRING_E2E_CONFIG, which must stay off this list: an entry here
      # is forwarded unconditionally, substituting an empty string when the
      # shell has not exported it, and would shadow the launchd value.
      environmentVariables:
        HEELER_SSH_E2E_REQUIRED: $(HEELER_SSH_E2E_REQUIRED)
      # Tests assert English copy. Pin the language so a Simulator set to
      # another language (Japanese is localized) runs the same suite;
      # `xcodebuild -testLanguage` still overrides it for a localized run.
      language: en
      region: US
    run:
      config: Debug
  HeelerLiveTests:
    build:
      targets:
        Heeler: all
    test:
      targets:
        - HeelerLiveTests
      language: en
      region: US
