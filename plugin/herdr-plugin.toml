id = "heeler"
name = "heeler"
version = "0.4.0"
min_herdr_version = "0.7.5"
description = "Pair a Heeler device by scanning a QR Pairing Code"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci"]

[[startup]]
command = ["node", "src/sidebar-hook.js"]

[[actions]]
id = "pair"
title = "Pair a mobile device"
description = "Show a Pairing Code QR for the Heeler app"
contexts = ["global"]
command = ["node", "src/pair-action.js"]

[[panes]]
id = "pair"
title = "Pair device"
placement = "popup"
width = "100%"
height = "100%"
command = ["node", "src/pair-popup.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/notify-hook.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/activity-hook.js"]
