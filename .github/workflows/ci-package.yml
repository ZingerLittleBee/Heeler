# Compiles HeelerSSH and its tests on PRs and pushes that change the package
# (refs #23). The app build in ci.yml compiles HeelerSSH only as a library, so
# without this a package change that breaks its own tests would first fail
# in ci-full.yml. Nothing runs and no Simulator boots; the package E2E suite
# stays in full verification.
#
# Positive `paths`: only the package and this file start it. Makefile edits
# start ci.yml instead; the Ubuntu workflow contract pins the
# build-ci-package command, so they never spend a second macOS worker.

name: HeelerSSH build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Packages/HeelerSSH/**
      - .github/workflows/ci-package.yml
  push:
    branches: [main]
    paths:
      - Packages/HeelerSSH/**
      - .github/workflows/ci-package.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-heelerssh-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-build:
    name: Build HeelerSSH and tests (not run)
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Build HeelerSSH and tests without launching a Simulator
        timeout-minutes: 20
        run: make build-ci-package
