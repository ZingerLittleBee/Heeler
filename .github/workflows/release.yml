# Immutable TestFlight candidates. Store submission stays in App Store Connect.
# A build tag names a main commit; this workflow archives it with the tag's
# version and build and uploads it, without running the test suites (ADR 0039).
# See docs/guides/releasing.md for numbering, recovery and migration policy.
name: Release

on:
  push:
    tags: ['builds/**']
  workflow_dispatch:
    inputs:
      version:
        description: Numeric marketing version for signing/validation rehearsal (no upload)
        required: true
        type: string

permissions: {}

# Serialization is not a FIFO allocator. CI rechecks predecessor settlement
# inside this lock, so a local reservation cannot bypass an uncertain upload.
concurrency:
  group: heeler-app-distribution
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve the candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and reserve a draft checkpoint
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/testflight.py ci-init

  archive:
    name: Upload or observe the candidate
    needs: meta
    # iPhone Duo fills its inner display only for apps built with the iOS
    # 27.1 SDK or later; an iOS 26 SDK build sits centered with empty space
    # around it (#625, developer.apple.com/iphone-duo/prepare). The Duo
    # controls also sit behind `#if compiler(>=6.4)`. `Xcode_27.2.app` is the
    # image's alias for its 27.2 install, release candidate or final. The
    # fast builds and full verification (ci-full.yml) use the same toolchain.
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      MODE: ${{ needs.meta.outputs.mode }}
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD: ${{ needs.meta.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Apple inventory and choose the recovery action
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: python3 scripts/testflight.py ci-plan

      - name: Show Xcode version
        if: steps.plan.outputs.action == 'archive'
        run: xcodebuild -version

      - name: Verify HeelerSSH native artifacts
        if: steps.plan.outputs.action == 'archive'
        run: make verify-ssh-artifacts

      # Resolve pinned packages without caches, before installing signing material.
      - name: Resolve packages
        if: steps.plan.outputs.action == 'archive'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Heeler.xcodeproj -scheme Heeler \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Install signing material
        if: steps.plan.outputs.action == 'archive'
        env:
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          DISTRIBUTION_CERT_SHA1: ${{ vars.DISTRIBUTION_CERT_SHA1 }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_NOTIFICATION_SERVICE_BASE64: ${{ secrets.PROFILE_NOTIFICATION_SERVICE_BASE64 }}
          PROFILE_WIDGETS_BASE64: ${{ secrets.PROFILE_WIDGETS_BASE64 }}
        run: python3 scripts/release-signing.py install --dir "$RUNNER_TEMP/signing"

      - name: Archive
        if: steps.plan.outputs.action == 'archive'
        # The tag, not the committed project, names the version and build.
        # Command-line settings apply to every target, so the app and its
        # extensions agree; verify-ipa checks each bundle.
        run: |
          set -euo pipefail
          xcodebuild -project Heeler.xcodeproj -scheme Heeler -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Heeler.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -onlyUsePackageVersionsFromResolvedFile \
            -xcconfig "$RUNNER_TEMP/signing/signing.xcconfig" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            HEELER_SOURCE_REVISION="$(git rev-parse HEAD)" \
            archive

      - name: Export the IPA
        if: steps.plan.outputs.action == 'archive'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Heeler.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify the IPA
        if: steps.plan.outputs.action == 'archive'
        run: python3 scripts/release-signing.py verify-ipa "$RUNNER_TEMP/export/Heeler.ipa" --version "$VERSION" --build "$BUILD"

      - name: Rehearse dSYM packaging without retaining or publishing assets
        if: env.MODE == 'rehearsal' && steps.plan.outputs.action == 'archive'
        env:
          ARCHIVE: ${{ runner.temp }}/Heeler.xcarchive
          IPA: ${{ runner.temp }}/export/Heeler.ipa
          DSYM_ZIP: ${{ runner.temp }}/Heeler-dSYMs.zip
        run: python3 scripts/testflight.py ci-symbols

      - name: Install the App Store Connect key
        if: steps.plan.outputs.action == 'archive'
        env:
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_API_KEY_ID" && -n "$ASC_API_KEY_P8" ]] || { echo "::error::Missing App Store Connect credentials"; exit 1; }
          keys="$RUNNER_TEMP/private_keys"
          mkdir -m 700 "$keys"
          (umask 077; printf '%s\n' "$ASC_API_KEY_P8" > "$keys/AuthKey_$ASC_API_KEY_ID.p8")
          echo "API_PRIVATE_KEYS_DIR=$keys" >> "$GITHUB_ENV"

      - name: Validate with App Store Connect
        if: steps.plan.outputs.action == 'archive'
        env:
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --validate-app -f "$RUNNER_TEMP/export/Heeler.ipa" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Retain matching dSYMs, checkpoint and upload once
        if: env.MODE == 'candidate' && steps.plan.outputs.action == 'archive'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ runner.temp }}/Heeler.xcarchive
          IPA: ${{ runner.temp }}/export/Heeler.ipa
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: python3 scripts/testflight.py ci-upload

      - name: Wait for Apple processing
        if: env.MODE == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: python3 scripts/testflight.py ci-observe

      # No raw API responses, archives, IPAs or signing files in public artifacts.
      - name: Remove signing material
        if: always()
        run: |
          python3 scripts/release-signing.py cleanup --dir "$RUNNER_TEMP/signing"
          rm -rf "$RUNNER_TEMP/private_keys"

  release:
    name: Record the processed TestFlight build
    needs: [meta, archive]
    if: needs.meta.outputs.mode == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify retained dSYMs, attach the manifest and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/testflight.py ci-publish
