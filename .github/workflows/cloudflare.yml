# Build and deploy the docs site (docs-site/) and landing page (landing/) to Cloudflare Workers.

name: Cloudflare sites

on:
  pull_request:
    paths:
      - docs-site/**
      - docs/guides/**
      - landing/**
      - .github/workflows/cloudflare.yml
  push:
    branches: [main]
    paths:
      - docs-site/**
      - docs/guides/**
      - landing/**
      - .github/workflows/cloudflare.yml

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  docs-site:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if docs site changed
        id: scope
        working-directory: .
        run: |
          changed=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --quiet "${{ github.event.pull_request.base.sha }}...HEAD" -- docs-site docs/guides .github/workflows/cloudflare.yml && changed=false
          elif [[ ! "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --quiet "${{ github.event.before }}...${{ github.sha }}" -- docs-site docs/guides .github/workflows/cloudflare.yml && changed=false
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.changed == 'true'
        with:
          package_json_file: docs-site/package.json

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Build and verify docs site
        if: steps.scope.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run check
          pnpm run build
          pnpm run check:links

      - name: Deploy docs site
        if: steps.scope.outputs.changed == 'true' && github.event_name == 'push'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

  landing:
    name: Landing
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if landing changed
        id: scope
        working-directory: .
        run: |
          changed=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --quiet "${{ github.event.pull_request.base.sha }}...HEAD" -- landing .github/workflows/cloudflare.yml && changed=false
          elif [[ ! "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff --quiet "${{ github.event.before }}...${{ github.sha }}" -- landing .github/workflows/cloudflare.yml && changed=false
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Build and verify landing
        if: steps.scope.outputs.changed == 'true'
        run: |
          npm ci
          npm run check
          npm run build
          npm run check:seo

      - name: Deploy landing
        if: steps.scope.outputs.changed == 'true' && github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
