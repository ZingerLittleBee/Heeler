name: Compilation cache sample

# One sampling branch only. This is not a test or release gate.
on:
  push:
    branches: [ci/compile-profile-20261101]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HEELER_SSH_E2E_REQUIRED: '0'
  PROFILE_SOURCE_SHA: a789fd5d5791a5d4096eff0f419ffcb4a637f58d

jobs:
  seed:
    name: Compare disabled, cold, and warm compilation caches
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Match ordinary CI's source cache without restoring compiled products.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Verify unchanged build inputs and native artifacts
        run: |
          git fetch --depth=1 origin "$PROFILE_SOURCE_SHA"
          git diff --exit-code "$PROFILE_SOURCE_SHA" HEAD -- Sources Tests Packages Heeler.xcodeproj project.yml plugin/test-vectors
          make check-test-membership verify-ssh-artifacts
      - name: Compare three fresh builds on the same runner
        timeout-minutes: 95
        run: make profile-ci-build PROFILE_PHASE=seed
      # A run-specific key cannot overwrite or be mistaken for production cache.
      # Only CAS is transferred, never DerivedData, products, or test results.
      - name: Save compilation cache for the second runner
        uses: actions/cache/save@v4
        with:
          path: .ci/compilation-cache
          key: compile-profile-${{ runner.os }}-xcode26.6-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload compile timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-cache-seed-${{ github.sha }}
          path: .ci/compile-profile
          if-no-files-found: error
          retention-days: 14

  restored:
    name: Verify restored cache, source edits, and invalidation
    needs: seed
    runs-on: macos-26
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore dependency sources
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Restore the exact compilation cache from this run
        uses: actions/cache/restore@v4
        with:
          path: .ci/compilation-cache
          key: compile-profile-${{ runner.os }}-xcode26.6-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Verify unchanged build inputs and native artifacts
        run: |
          git fetch --depth=1 origin "$PROFILE_SOURCE_SHA"
          git diff --exit-code "$PROFILE_SOURCE_SHA" HEAD -- Sources Tests Packages Heeler.xcodeproj project.yml plugin/test-vectors
          make check-test-membership verify-ssh-artifacts
      - name: Measure restored builds and reject stale source products
        timeout-minutes: 125
        run: make profile-ci-build PROFILE_PHASE=restored
      - name: Upload compile timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-cache-restored-${{ github.sha }}
          path: .ci/compile-profile
          if-no-files-found: error
          retention-days: 14
