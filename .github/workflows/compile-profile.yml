name: Compile timing sample

# One sampling branch only. This is not a test or release gate.
on:
  push:
    branches: [ci/compile-profile-20261101]

permissions:
  contents: read

jobs:
  build:
    name: Profile app and test compilation (no test execution)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HEELER_SSH_E2E_REQUIRED: '0'
      PROFILE_SOURCE_SHA: a789fd5d5791a5d4096eff0f419ffcb4a637f58d
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Match ordinary CI's source cache without restoring compiled products.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Verify unchanged build inputs and native artifacts
        run: |
          git diff --exit-code "$PROFILE_SOURCE_SHA" HEAD -- Sources Tests Packages Heeler.xcodeproj project.yml plugin/test-vectors
          make check-test-membership verify-ssh-artifacts
      - name: Build once and export native timing evidence
        timeout-minutes: 35
        run: make profile-ci-build
      - name: Upload compile timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-profile-${{ github.sha }}
          path: .ci/compile-profile
          if-no-files-found: error
          retention-days: 14
