# Full native verification, run daily, manually or by release.yml (refs #23).
#
# Runs the complete app and SSH package suites on isolated iOS simulators.
# No signing certificates, archive, or xcodegen. Simulator builds use free
# ad-hoc signing ("Sign to Run Locally"), so no certificate or provisioning
# profile is needed. We must NOT pass CODE_SIGNING_ALLOWED=NO: it strips the
# app's signature and with it the keychain-access entitlement, which breaks the
# tests that run against the real simulator keychain (errSecMissingEntitlement).
#
# Plugin tests, the push relay, and wire-type codegen live in ci-node.yml.
# The marketing site lives in landing.yml.
#
# Notes:
# - The committed Heeler.xcodeproj (project + shared Heeler scheme)
#   is the source of truth for CI. project.yml/xcodegen is a local convenience
#   only; CI never regenerates the project.
# - The real-SSH suites are mandatory in this workflow. The test script provisions
#   disposable high-port sshd instances that run unprivileged as the runner
#   account, plus a Unix-socket fake herdr server, and asserts both the executed
#   test count and the named test behind every mandatory behaviour. Only the
#   real-password fixture needs sudo, because macOS cannot verify an account
#   password without root.
#
# Daily build checks live in ci.yml; isolated repetitions live in
# ci-diagnostics.yml. Neither claims the complete coverage produced here.

name: iOS full verification
run-name: ${{ format('iOS full verification ({0}, {1})', inputs.layout || 'sharded', inputs.cache_mode || 'warm') }}

on:
  # Default branch only, at 04:17 China Standard Time (UTC+8).
  # Avoid the busy start of the hour; use the sharded, warm-cache defaults.
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      layout:
        description: Test topology (serial retains the comparison entrypoint)
        type: choice
        options: [sharded, serial]
        default: sharded
      cache_mode:
        description: Restore dependency sources and compiler CAS, or skip both caches
        type: choice
        options: [cold, warm]
        default: warm
      baseline_run:
        description: Optional completed same-SHA serial run for coverage comparison
        type: string
        default: ''
  # release.yml runs both lanes against the release tag before anything is
  # signed. A release cannot select a diagnostic or build-only mode.
  workflow_call:

# Daily builds and diagnostics must not cancel a full verification run.
concurrency:
  group: ci-ios-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  app-tests:
    name: App tests (${{ matrix.shard }})
    # macos-26 ships Xcode 26.x and the iOS 26 simulator runtimes. Pinned
    # rather than macos-latest for reproducibility.
    runs-on: macos-26
    # The job limit leaves the setup and upload steps room around the test step.
    timeout-minutes: ${{ inputs.layout == 'serial' && 65 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.layout == 'serial' && '["all"]' || '["session-weak","transport","ordinary"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HEELER_CI_EVIDENCE_DIR: ${{ github.workspace }}/.ci/test-evidence/app-${{ matrix.shard }}
      HEELER_CI_OVERLAP_BUILD: ${{ inputs.layout == 'serial' && '0' || '1' }}
      # Each matrix job owns a separate runner, but compiler command paths must
      # match across jobs/runs. Never restore DerivedData or test results.
      HEELER_CI_APP_DERIVED_DATA_PATH: ${{ github.workspace }}/.ci/app-derived
      HEELER_CI_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.ci/app-compilation-cache
      HEELER_CI_DISABLE_DEBUG_SYMBOLS: '1'
      # Hosted compilation can exceed 20 minutes even with restored sources.
      # Leave room for runner variance without treating this safety deadline
      # as a runtime target; cold and warm measurements use the same limit.
      HEELER_XCODEBUILD_BUILD_TIMEOUT_SECONDS: '1800'
      # The ordinary lane's full test call can pass every test and still
      # exceed 10 minutes before xcodebuild exits.
      HEELER_XCODEBUILD_TEST_TIMEOUT_SECONDS: '900'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Cache dependency sources, never compiled test products or results.
      # Cold benchmarks skip the entire action, including its post-run save.
      - name: Cache SwiftPM checkouts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'warm' }}
        uses: actions/cache@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Test VPS SSH access scripts
        run: scripts/test-vps-ssh-access-scripts.sh

      # Binary supply-chain gate: artifact checksums, device and Simulator
      # slices, and the algorithm policy (no OpenSSL legacy provider, no
      # obsolete SSH methods) that ADR 0011 commits to.
      - name: Verify HeelerSSH native artifacts
        run: make verify-ssh-artifacts

      # xcodebuild -version is enough to pin the image. Listing every
      # simulator runtime cold-starts CoreSimulator on the critical path
      # (~12–29s on hosted macOS-26); the gate's own simctl boot overlaps
      # that work with the build instead.
      - name: Show Xcode version
        id: toolchain
        env:
          BUILD_INPUT_HASH: ${{ hashFiles('project.yml', 'Heeler.xcodeproj/project.pbxproj', 'Heeler.xcodeproj/xcshareddata/xcschemes/Heeler.xcscheme', 'Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.swift') }}
        run: |
          xcodebuild -version
          identity=$({
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            uname -m
            printf '%s\n' "$BUILD_INPUT_HASH" 'Debug-no-symbols-no-index-v1'
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "cache-prefix=ios-app-cas-v1-${RUNNER_OS}-${RUNNER_ARCH}-${identity}-" >> "$GITHUB_OUTPUT"

      # Only content-addressed compiler objects cross runs. Source changes
      # remain eligible for reuse; the compiler validates their dependencies.
      - name: Restore app compilation cache
        id: compilation-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.cache_mode == 'warm' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.HEELER_CI_COMPILATION_CACHE_DIR }}
          key: ${{ steps.toolchain.outputs.cache-prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.toolchain.outputs.cache-prefix }}

      - name: Record cache and checkout identity
        env:
          CACHE_MODE: ${{ inputs.cache_mode || 'warm' }}
          APP_SHARD: ${{ matrix.shard }}
          COMPILATION_CACHE_KEY: ${{ steps.compilation-cache.outputs.cache-matched-key }}
          COMPILATION_CACHE_HIT: ${{ steps.compilation-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$HEELER_CI_EVIDENCE_DIR"
          if [[ "$CACHE_MODE" == cold && ( -e .ci/source-packages || -e "$HEELER_CI_COMPILATION_CACHE_DIR" ) ]]; then
            echo 'Cold run unexpectedly contains restored dependency sources or compiler CAS.' >&2
            exit 1
          fi
          {
            printf 'cache_mode=%s\nshard=%s\n' "$CACHE_MODE" "$APP_SHARD"
            printf 'checkout_sha=%s\nevent_sha=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA"
            printf 'image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'build_deadline_seconds=%s\n' "$HEELER_XCODEBUILD_BUILD_TIMEOUT_SECONDS"
            printf 'debug_symbols=disabled\n'
            printf 'compilation_cache=enabled\ncompilation_cache_key=%s\ncompilation_cache_exact_hit=%s\n' "$COMPILATION_CACHE_KEY" "$COMPILATION_CACHE_HIT"
            printf 'app_derived_data=%s\n' "$HEELER_CI_APP_DERIVED_DATA_PATH"
          } > "$HEELER_CI_EVIDENCE_DIR/run-settings.txt"

      # The script selects one available iPhone 17 UDID, boots it, injects the
      # fixture environment there, and targets that same device for every test
      # action. The app deployment target is iOS 18.
      #
      # A step timeout signals only the step shell, so the script's cleanup and
      # failure diagnostics survive only when its own watchdogs fire first. The
      # limit therefore nests the worst sharded budget: preparation (about 3
      # minutes), the 30-minute build deadline, a passing first suite (about 4),
      # and a hung second suite's 15-minute watchdog with sampling and cleanup.
      # Serial runs every phase once and has its own wider limit.
      - name: Build and test
        timeout-minutes: ${{ inputs.layout == 'serial' && 60 || 55 }}
        # The fixture runs unprivileged; HEELER_CI_MANDATORY makes the one
        # privileged part (the real-password sshd) a hard requirement here
        # rather than something merge CI may quietly run without.
        env:
          HEELER_CI_LANE: app
          APP_SHARD: ${{ matrix.shard }}
          HEELER_CI_MANDATORY: "1"
        run: |
          make test-ci-app CI_APP_SHARD="$APP_SHARD"
          python3 scripts/verify-ci-ios-evidence.py complete \
            --evidence-dir "$HEELER_CI_EVIDENCE_DIR" \
            --lane app --shard "$APP_SHARD" --sha "$GITHUB_SHA"

      # All shards compile the same target. One writer avoids redundant uploads.
      # A test failure does not invalidate compiler objects, and must not keep
      # later attempts cold. Coverage evidence is never saved in this cache.
      - name: Save app compilation cache
        if: ${{ !cancelled() && steps.compilation-cache.outcome == 'success' && steps.compilation-cache.outputs.cache-hit != 'true' && (matrix.shard == 'ordinary' || matrix.shard == 'all') }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.HEELER_CI_COMPILATION_CACHE_DIR }}
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Upload app test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # A partial rerun replaces only its worker; successful prerequisites
          # retain their same-run, same-SHA evidence for the aggregate. Keep it
          # for GitHub's 30-day rerun window.
          name: ios-ci-evidence-app-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ env.HEELER_CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload iOS CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-diagnostics-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heeler-ci-diagnostics-*
          if-no-files-found: ignore
          retention-days: 7

  heelerssh-package-e2e:
    name: HeelerSSH package E2E (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 36
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HEELER_CI_EVIDENCE_DIR: ${{ github.workspace }}/.ci/test-evidence/package
      HEELER_CI_OVERLAP_BUILD: ${{ inputs.layout == 'serial' && '0' || '1' }}
      HEELER_CI_DISABLE_COMPILATION_CACHE: '1'
      HEELER_CI_DISABLE_DEBUG_SYMBOLS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Same rationale as the app job: avoid a critical-path CoreSimulator
      # cold-start; package-lane boot overlaps with build-for-testing.
      - name: Show Xcode version
        run: xcodebuild -version

      # An early failure still uploads an evidence directory, so the upload
      # reports only the failure that stopped the worker.
      - name: Record checkout identity
        run: |
          mkdir -p "$HEELER_CI_EVIDENCE_DIR"
          {
            printf 'checkout_sha=%s\nevent_sha=%s\n' "$(git rev-parse HEAD)" "$GITHUB_SHA"
            printf 'image_version=%s\n' "${ImageVersion:-unknown}"
          } > "$HEELER_CI_EVIDENCE_DIR/run-settings.txt"

      # These checks exercise the same shipped helpers and process behavior on
      # macOS. Run them once in this mandatory worker so app builds can start
      # immediately; the aggregate requires this worker to pass as well. The
      # diagnostic controls also run in Agent tooling, but only this runner's
      # /bin/bash 3.2 matches the script that CI executes.
      - name: Test CI watchdog
        run: make test-ci-watchdog

      - name: Test CI gate guards
        run: make test-ci-guards

      - name: Test CI diagnostic controls
        run: make test-ci-diagnostic-controls

      # Nests the package budget like the app step: simulator discovery, the
      # 15-minute build deadline, and a hung suite's 10-minute watchdog with
      # sampling and cleanup. Passing runs take 6 to 12 minutes.
      - name: Run package E2E
        timeout-minutes: 30
        env:
          HEELER_CI_LANE: package
          HEELER_CI_MANDATORY: "1"
        run: |
          make test-ci-package
          python3 scripts/verify-ci-ios-evidence.py complete \
            --evidence-dir "$HEELER_CI_EVIDENCE_DIR" \
            --lane package --shard all --sha "$GITHUB_SHA"

      - name: Upload package test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-evidence-package-${{ github.run_id }}
          path: ${{ env.HEELER_CI_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload package CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heelerssh-package-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heeler-ci-diagnostics-*
          if-no-files-found: ignore
          retention-days: 7

  build-test:
    name: Build & test (iOS Simulator)
    needs: [app-tests, heelerssh-package-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every worker to succeed
        env:
          APP_RESULT: ${{ needs.app-tests.result }}
          PACKAGE_RESULT: ${{ needs.heelerssh-package-e2e.result }}
        run: |
          if [[ "$APP_RESULT" != success || "$PACKAGE_RESULT" != success ]]; then
            printf 'Worker failure: app=%s package=%s\n' "$APP_RESULT" "$PACKAGE_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-ci-evidence-*-${{ github.run_id }}
          path: .ci/evidence
      - name: Download same-SHA serial comparison
        if: ${{ inputs.baseline_run != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ios-ci-evidence-*
          path: .ci/baseline
          github-token: ${{ github.token }}
          run-id: ${{ inputs.baseline_run }}
      - name: Check test target membership
        # Evidence proves every test compiled into HeelerTests ran; this
        # proves every Swift source under Tests/HeelerTests is compiled in.
        run: make check-test-membership
      - name: Verify complete test coverage
        env:
          LAYOUT: ${{ inputs.layout || 'sharded' }}
          BASELINE_RUN: ${{ inputs.baseline_run }}
        run: |
          arguments=(verify --evidence-dir .ci/evidence --sha "$GITHUB_SHA" --layout "$LAYOUT" --require-package)
          if [[ -n "$BASELINE_RUN" ]]; then
            arguments+=(--baseline .ci/baseline)
          fi
          python3 scripts/verify-ci-ios-evidence.py "${arguments[@]}"
