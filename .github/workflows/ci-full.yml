# Daily and manual full iOS Simulator verification (ADR 0039).

name: iOS full verification

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  group: ci-ios-full-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  app-build:
    name: App & package build (shared)
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/app-compilation-cache
          key: ios-full-cas-v3-${{ runner.arch }}-${{ hashFiles('project.yml', 'Heeler.xcodeproj/project.pbxproj', 'Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-full-cas-v3-${{ runner.arch }}-${{ hashFiles('project.yml', 'Heeler.xcodeproj/project.pbxproj', 'Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.swift') }}-
            ios-full-cas-v3-${{ runner.arch }}-

      - name: Build and pack app and HeelerSSH test products
        timeout-minutes: 45
        run: |
          make verify-ssh-artifacts
          make check-test-membership
          make build-ci-app
          make build-ci-package
          make pack-ci-app-products
          make pack-ci-package-products

      - name: Upload app build products
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-app-products-${{ github.run_id }}
          path: .ci/app-products.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

      - name: Upload HeelerSSH build products
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-package-products-${{ github.run_id }}
          path: .ci/package-products.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

      - name: Save compilation cache
        if: ${{ success() && steps.compilation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci/app-compilation-cache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

  app-tests:
    name: App & SSH tests (${{ matrix.shard }})
    needs: app-build
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.shard == 'ordinary' && 50 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [session-weak, transport, ordinary]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HEELER_CI_SIMULATOR_OS: '27.2'
      HEELER_CI_APP_DERIVED_DATA_PATH: ${{ github.workspace }}/.ci/app-derived
      HEELER_CI_APP_PRODUCTS_ARCHIVE: ${{ github.workspace }}/.ci/app-products/app-products.tar
      HEELER_CI_PACKAGE_PRODUCTS_ARCHIVE: ${{ matrix.shard == 'session-weak' && format('{0}/.ci/package-products/package-products.tar', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        if: ${{ matrix.shard != 'ordinary' }}
        with:
          node-version: 24

      - name: Cache pinned herdr-core archive
        if: ${{ matrix.shard == 'session-weak' }}
        uses: actions/cache@v4
        with:
          path: .ci/herdr-core-archive
          key: herdr-core-archive-${{ runner.arch }}-${{ hashFiles('scripts/fixtures/herdr-core-archive.sha256') }}

      - name: Install tmux for the tmux Host suite
        if: ${{ matrix.shard == 'transport' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v tmux >/dev/null || brew install tmux
          tmux -V

      - name: Download app build products
        uses: actions/download-artifact@v4
        with:
          name: ios-ci-app-products-${{ github.run_id }}
          path: .ci/app-products

      - name: Download HeelerSSH build products
        if: ${{ matrix.shard == 'session-weak' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-ci-package-products-${{ github.run_id }}
          path: .ci/package-products

      - name: Run tests
        timeout-minutes: ${{ matrix.shard == 'ordinary' && 45 || 35 }}
        run: make test-ci-app CI_APP_SHARD="${{ matrix.shard }}"

      - name: Upload iOS CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-diagnostics-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heeler-ci-diagnostics-*
          if-no-files-found: ignore
          retention-days: 7
