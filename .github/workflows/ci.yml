# Fast feedback on PRs and pushes to main that change build inputs (refs #23).
# Full Swift and SSH verification lives in ci-full.yml, which runs daily and
# manually; releases do not wait for it (ADR 0039). ci-package.yml compiles
# HeelerSSH's own tests, which this app build compiles only as a library.
#
# app-build compiles the committed app and extensions with `xcodebuild build`
# against the generic Simulator SDK. It never compiles the HeelerTests
# bundle, boots a Simulator or executes a test, so a green build establishes
# that the app compiles, not behavior. Test sources an app change breaks fail
# in the focused tests its author runs, and in ci-full.yml's app-build.
#
# Positive `paths` (not paths-ignore): one matching path is enough, so a
# commit that also edits markdown still runs. Only build inputs start it, and
# the two scripts listed are the ones this job executes. Tests/** and
# plugin/test-vectors/** belong to the test bundle, so a change to them alone
# builds nothing here. Other script and ci-full.yml changes start only
# ci-scripts.yml, never an app build. landing/**, LICENSE, prose, plugin/src,
# plugin/package.json, and relay/** never spend a macOS runner.
name: iOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Sources/**
      - Packages/**
      - Heeler.xcodeproj/**
      - project.yml
      - Makefile
      - scripts/run-ci-background-build.py
      - scripts/ci-compilation-cache-prefix.sh
      - .github/workflows/ci.yml
  push:
    branches: [main]
    paths:
      - Sources/**
      - Packages/**
      - Heeler.xcodeproj/**
      - project.yml
      - Makefile
      - scripts/run-ci-background-build.py
      - scripts/ci-compilation-cache-prefix.sh
      - .github/workflows/ci.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    name: Build app (tests not compiled)
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Verify HeelerSSH native artifacts
        run: make verify-ssh-artifacts
      - name: Record build identity
        id: cache-key
        run: |
          mkdir -p .ci/build-evidence
          scripts/ci-compilation-cache-prefix.sh ios-fast-cas-v2 .ci/build-evidence/toolchain.txt
          printf 'checkout_sha=%s\nimage_version=%s\ntests_compiled=0\ntests_executed=0\n' \
            "$(git rev-parse HEAD)" "${ImageVersion:-unknown}" > .ci/build-evidence/run-settings.txt
      # Cache compiler objects, never DerivedData, products or test results.
      # Full verification's shared build also compiles the tests and keeps a
      # namespace of its own, so its cold and warm measurements never read
      # what this build saved.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/app-compilation-cache
          key: ${{ steps.cache-key.outputs.cache-prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-key.outputs.cache-prefix }}
      - name: Build app and extensions without launching a Simulator
        timeout-minutes: 20
        run: |
          python3 scripts/run-ci-background-build.py --timing-path .ci/build-evidence/build.json -- \
            make build-ci-app-only 2>&1 | tee .ci/build-evidence/build.log
      - name: Save compilation cache
        if: ${{ success() && steps.compilation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci/app-compilation-cache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}
      - name: Upload build logs and timing (not test evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/build-evidence
          if-no-files-found: ignore
          retention-days: 7
