# Pull-request checks and fast iOS Simulator SDK build.
# Full Simulator test execution runs on schedule and manual dispatch in ci-full.yml.

name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - Sources/**
      - Packages/**
      - Heeler.xcodeproj/**
      - project.yml
      - Makefile
      - .github/workflows/ci.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action == 'edited' && 'edit' || 'code' }}
  cancel-in-progress: true

jobs:
  check-commit-attribution:
    name: Check commit attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          bash .github/scripts/check-co-authors.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Check PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/check-pr-attribution.sh

  checks:
    name: Checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'edited')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check docs, test membership, localizations, and wire-type codegen
        run: |
          make check-agent-docs
          make check-test-membership
          python3 scripts/check-localizations.py
          python3 scripts/generate-wire-types.py --check --schema scripts/herdr-schema.json

      - name: Detect changed Node packages
        id: scope
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            printf 'plugin=true\nrelay=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          plugin=false
          relay=false
          git diff --quiet "$base...HEAD" -- plugin .github/workflows/ci.yml || plugin=true
          git diff --quiet "$base...HEAD" -- relay .github/workflows/ci.yml || relay=true
          printf 'plugin=%s\nrelay=%s\n' "$plugin" "$relay" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.scope.outputs.plugin == 'true' || steps.scope.outputs.relay == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Run push relay tests
        if: steps.scope.outputs.relay == 'true'
        run: npm --prefix relay test

      - name: Run pairing plugin tests
        if: steps.scope.outputs.plugin == 'true'
        run: |
          command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux)
          npm --prefix plugin ci
          npm --prefix plugin test

  ios-build:
    name: Build iOS app
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed iOS inputs
        id: scope
        run: |
          app=true
          pkg=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pkg=true
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            if git diff --quiet "$base...HEAD" -- Sources Packages Heeler.xcodeproj project.yml Makefile .github/workflows/ci.yml; then
              app=false
            fi
            git diff --quiet "$base...HEAD" -- Packages/HeelerSSH .github/workflows/ci.yml || pkg=true
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            pkg=true
          else
            git diff --quiet "${{ github.event.before }}...${{ github.sha }}" -- Packages/HeelerSSH .github/workflows/ci.yml || pkg=true
          fi
          printf 'app=%s\npkg=%s\n' "$app" "$pkg" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM checkouts
        if: steps.scope.outputs.app == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Restore compilation cache
        id: compilation-cache
        if: steps.scope.outputs.app == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ci/app-compilation-cache
          key: ios-fast-cas-v3-${{ runner.arch }}-${{ hashFiles('project.yml', 'Heeler.xcodeproj/project.pbxproj', 'Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-fast-cas-v3-${{ runner.arch }}-${{ hashFiles('project.yml', 'Heeler.xcodeproj/project.pbxproj', 'Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.swift') }}-
            ios-fast-cas-v3-${{ runner.arch }}-

      - name: Build app and extensions
        if: steps.scope.outputs.app == 'true'
        timeout-minutes: 20
        run: |
          make verify-ssh-artifacts
          make build-ci-app-only

      - name: Build HeelerSSH tests
        if: steps.scope.outputs.pkg == 'true'
        timeout-minutes: 15
        run: make build-ci-package

      - name: Save compilation cache
        if: ${{ success() && steps.scope.outputs.app == 'true' && steps.compilation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci/app-compilation-cache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}
