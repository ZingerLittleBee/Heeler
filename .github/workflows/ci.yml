# Fast feedback only. Full Swift/UI/SSH verification lives in ci-full.yml.
name: iOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Sources/**
      - Packages/**
      - Heeler.xcodeproj/**
      - project.yml
      - Makefile
      - scripts/run-ci-background-build.py
      - .github/workflows/ci.yml
  push:
    branches: [main]
    paths:
      - Sources/**
      - Packages/**
      - Heeler.xcodeproj/**
      - project.yml
      - Makefile
      - scripts/run-ci-background-build.py
      - .github/workflows/ci.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    name: Build app (no tests)
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Verify HeelerSSH native artifacts
        run: make verify-ssh-artifacts
      - name: Record build identity
        id: toolchain
        env:
          BUILD_INPUT_HASH: ${{ hashFiles('project.yml', 'Heeler.xcodeproj/project.pbxproj', 'Heeler.xcodeproj/xcshareddata/xcschemes/Heeler.xcscheme', 'Heeler.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/**/Package.swift') }}
        run: |
          mkdir -p .ci/build-evidence
          {
            xcodebuild -version
            xcrun --sdk iphonesimulator --show-sdk-version
            uname -m
            printf '%s\n' "$BUILD_INPUT_HASH" 'Debug-no-symbols-no-index-v1'
          } | tee .ci/build-evidence/toolchain.txt
          identity=$(shasum -a 256 .ci/build-evidence/toolchain.txt | cut -d ' ' -f 1)
          echo "cache-prefix=ios-build-cas-v1-${RUNNER_OS}-${RUNNER_ARCH}-${identity}-" >> "$GITHUB_OUTPUT"
          printf 'checkout_sha=%s\nimage_version=%s\ntests_executed=0\n' \
            "$(git rev-parse HEAD)" "${ImageVersion:-unknown}" > .ci/build-evidence/run-settings.txt
      # Cache compiler objects, never DerivedData, products or test results.
      # Use a separate namespace so a build-only run cannot occupy the full
      # suite's same-SHA cache key without its compiled test objects.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/app-compilation-cache
          key: ${{ steps.toolchain.outputs.cache-prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.toolchain.outputs.cache-prefix }}
      - name: Build app and extensions without launching a Simulator
        timeout-minutes: 15
        run: |
          python3 scripts/run-ci-background-build.py --timing-path .ci/build-evidence/build.json -- \
            make build-ci-app 2>&1 | tee .ci/build-evidence/build.log
      - name: Save compilation cache
        if: ${{ success() && steps.compilation-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci/app-compilation-cache
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}
      - name: Upload build logs and timing (not test evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/build-evidence
          if-no-files-found: ignore
          retention-days: 7
