# Headless build + test suite for every PR (User Story 12, refs #23).
#
# Runs the full XCTest suite on an iOS simulator. Kept deliberately minimal:
# no signing certificates, no archive, no xcodegen. Simulator builds use free
# ad-hoc signing ("Sign to Run Locally"), so no certificate or provisioning
# profile is needed. We must NOT pass CODE_SIGNING_ALLOWED=NO: it strips the
# app's signature and with it the keychain-access entitlement, which breaks the
# tests that run against the real simulator keychain (errSecMissingEntitlement).
#
# Notes:
# - The committed Heeler.xcodeproj (project + shared Heeler scheme)
#   is the source of truth for CI. project.yml/xcodegen is a local convenience
#   only; CI never regenerates the project.
# - The real-SSH suites are mandatory in CI. The test script provisions
#   disposable high-port sshd instances that run unprivileged as the runner
#   account, plus a Unix-socket fake herdr server, and asserts both the executed
#   test count and the named test behind every mandatory behaviour. Only the
#   real-password fixture needs sudo, because macOS cannot verify an account
#   password without root.
# - Wire-type codegen drift is checked against a committed schema snapshot
#   (scripts/herdr-schema.json), captured from herdr 0.7.4 via
#   `herdr api schema --json`. CI has no herdr binary, so `--schema` feeds the
#   snapshot instead of shelling out. The snapshot also pins the exact schema
#   version the generated types were built from.

name: CI

# `landing/**` is the marketing site (Astro, deployed to Cloudflare); it shares
# nothing with the app, the plugin, or the relay, so it has its own workflow
# (landing.yml) and is excluded here. A change touching both still runs this
# workflow: paths-ignore only skips a run when every changed path matches.
on:
  pull_request:
    paths-ignore:
      - landing/**
  push:
    branches: [main]
    paths-ignore:
      - landing/**

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-test:
    name: Pairing plugin (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run plugin tests
        run: npm test

  relay-test:
    name: Push relay (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The relay has zero dependencies, so there is no install step.
      - name: Run relay tests
        run: npm test

  codegen-drift:
    name: Wire-type codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check generated wire types are up to date
        run: scripts/generate-wire-types.py --check --schema scripts/herdr-schema.json

  build-test:
    name: Build & test (iOS Simulator)
    # macos-26 ships Xcode 26.x and the iOS 26 simulator runtimes. Pinned
    # rather than macos-latest for reproducibility.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test VPS SSH access scripts
        run: scripts/test-vps-ssh-access-scripts.sh

      # Binary supply-chain gate: artifact checksums, device and Simulator
      # slices, and the algorithm policy (no OpenSSL legacy provider, no
      # obsolete SSH methods) that ADR 0011 commits to.
      - name: Verify HeelerSSH native artifacts
        run: make verify-ssh-artifacts

      - name: Show Xcode and simulator versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # The script selects one available iPhone 17 UDID, boots it, injects the
      # fixture environment there, and targets that same device for every test
      # action. The app deployment target is iOS 26.
      - name: Build and test
        # The fixture runs unprivileged; HEELER_CI_MANDATORY makes the one
        # privileged part (the real-password sshd) a hard requirement here
        # rather than something merge CI may quietly run without.
        env:
          HEELER_CI_MANDATORY: "1"
        run: scripts/run-ci-ios-tests.sh
