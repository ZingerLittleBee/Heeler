# Build and deploy the landing page (landing/) to Cloudflare Workers.
#
# This is the only workflow a landing-only change runs: ci.yml ignores
# `landing/**`, and this one only fires when `landing/**` (or this file)
# changes, so marketing-site edits never spend a macOS runner.
#
# A pull request builds and typechecks; a push to main also deploys. The deploy
# needs two repository secrets:
#
#   CLOUDFLARE_API_TOKEN    scoped to Workers Scripts:Edit on the account that
#                           owns the bybee.dev zone (same account as relay/)
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account id
#
# wrangler comes from landing/package-lock.json rather than a third-party
# action, so the deploying binary is the same one `npm run deploy` uses locally.

name: Landing

on:
  pull_request:
    paths:
      - landing/**
      - .github/workflows/landing.yml
  push:
    branches: [main]
    paths:
      - landing/**
      - .github/workflows/landing.yml

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # Only main deploys; a pull request stops at a verified build.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
